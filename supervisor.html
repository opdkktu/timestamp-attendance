<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penyelia — SIAGA</title>
<link rel="icon" type="image/png" href="./siaga-192.png?v=1.21.1">
<link rel="apple-touch-icon" href="./siaga-512.png?v=1.21.1">
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --teal-900:#0B3D3A; --teal-700:#0F5C56; --teal-500:#1C8F84; --bg:#F3F8F6; --ink-700:#1E2B29; --ink-500:#5B6B68; --line:#DCEAE6; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--ink-700); font-family:'Inter',system-ui,sans-serif; }
  header{ background:linear-gradient(135deg,var(--teal-900),var(--teal-500)); color:#fff; padding:16px; position:sticky; top:0; z-index:5; }
  .top{ display:flex; align-items:center; gap:12px; }
  header a{ color:#fff; text-decoration:none; font-size:22px; }
  header h1{ margin:0; font-family:'Manrope',sans-serif; font-size:18px; flex:1; }
  .lvl{ font-size:11px; font-weight:800; background:rgba(255,255,255,.2); padding:4px 10px; border-radius:99px; }
  .search{ margin-top:12px; width:100%; border:none; border-radius:14px; padding:13px 14px; font:inherit; font-size:15px; }
  .search:focus{ outline:3px solid rgba(255,255,255,.4); }
  main{ max-width:640px; margin:0 auto; padding:14px 16px 40px; }
  .chips{ display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none; }
  .chip{ flex:none; border:1.5px solid var(--line); background:#fff; color:var(--teal-900); border-radius:99px; padding:7px 14px; font-weight:700; font-size:12.5px; cursor:pointer; }
  .chip.on{ background:var(--teal-700); border-color:var(--teal-700); color:#fff; }
  .count{ font-size:12px; color:var(--ink-500); margin:2px 2px 8px; }
  .person{ width:100%; display:flex; align-items:center; gap:12px; text-align:left; background:#fff; border:1px solid var(--line); border-radius:16px; padding:12px 14px; margin-bottom:9px; cursor:pointer; font:inherit; }
  .person:active{ transform:scale(.99); }
  .av{ width:42px; height:42px; border-radius:50%; background:linear-gradient(135deg,var(--teal-500),var(--teal-700)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; flex:none; }
  .nm{ font-weight:700; font-size:14px; color:var(--teal-900); }
  .un{ font-size:12px; color:var(--ink-500); margin-top:1px; }
  .go{ margin-left:auto; color:var(--teal-500); font-size:20px; }
  .empty{ text-align:center; color:var(--ink-500); padding:40px 10px; font-size:14px; }
  .skel{ height:66px; border-radius:16px; margin-bottom:9px; background:linear-gradient(90deg,#e6efec,#f5faf8,#e6efec); background-size:200% 100%; animation:sh 1.2s infinite; }
  @keyframes sh{ to{ background-position:-200% 0; } }
  .note{ font-size:12px; color:var(--ink-500); background:#fff; border:1px dashed var(--line); border-radius:12px; padding:10px 12px; margin-bottom:12px; }
  .annbtn{ width:100%; height:50px; border:none; border-radius:14px; margin-bottom:12px; background:linear-gradient(90deg,var(--teal-700),var(--teal-500)); color:#fff; font-weight:800; font-size:15px; cursor:pointer; box-shadow:0 6px 16px rgba(15,92,86,.25); }
  .sheetbg{ position:fixed; inset:0; background:rgba(8,20,18,.55); display:none; align-items:flex-end; justify-content:center; z-index:30; }
  .sheetbg.show{ display:flex; }
  .sheet{ background:#fff; width:100%; max-width:560px; border-radius:22px 22px 0 0; padding:18px 18px 24px; max-height:92vh; overflow:auto; animation:up .25s ease; }
  @keyframes up{ from{ transform:translateY(40px); opacity:0; } }
  .sheet h3{ margin:0 0 12px; font-family:'Manrope',sans-serif; color:var(--teal-900); }
  .sheet label{ display:block; font-size:12px; font-weight:700; color:var(--ink-500); margin:12px 0 5px; }
  .sheet input,.sheet textarea,.sheet select{ width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px; font:inherit; font-size:15px; background:#fff; }
  .sheet input:focus,.sheet textarea:focus,.sheet select:focus{ outline:none; border-color:var(--teal-500); box-shadow:0 0 0 3px rgba(28,143,132,.15); }
  .tpl{ display:flex; gap:8px; overflow-x:auto; padding:2px 0 4px; scrollbar-width:none; }
  .tpl button{ flex:none; border:1.5px solid var(--line); background:var(--bg); border-radius:99px; padding:6px 12px; font-size:12px; font-weight:700; color:var(--teal-900); cursor:pointer; }
  .cnt{ text-align:right; font-size:11px; color:var(--ink-500); margin-top:3px; }
  .srow{ display:flex; gap:10px; margin-top:16px; }
  .srow button{ flex:1; height:48px; border-radius:14px; border:none; font-weight:800; font-size:15px; cursor:pointer; }
  .srow .cancel{ background:var(--bg); color:var(--ink-700); }
  .srow .send{ background:var(--teal-700); color:#fff; } .srow .send:disabled{ opacity:.6; }
  .lim{ font-size:12px; color:var(--ink-500); margin-top:10px; }
  .recent{ margin-top:14px; font-size:12px; color:var(--ink-500); border-top:1px solid var(--line); padding-top:10px; }
  .toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(90px); background:#111; color:#fff; padding:12px 18px; border-radius:12px; font-size:13px; transition:.3s; z-index:60; max-width:90%; text-align:center; }
  .toast.show{ transform:translateX(-50%) translateY(0); }
  .loading{ position:fixed; inset:0; background:rgba(8,20,18,.6); display:none; align-items:center; justify-content:center; color:#fff; font-weight:700; z-index:20; }
  .loading.show{ display:flex; }
</style>
</head>
<body>
<header>
  <div class="top"><a href="./dashboard.html" aria-label="Kembali">←</a><h1>Staf di bawah seliaan</h1><span class="lvl" id="lvl"></span></div>
  <input class="search" id="q" type="search" placeholder="Cari nama staf…" autocomplete="off">
</header>
<main>
  <button class="annbtn" id="annOpen">📣 Hantar pengumuman kepada staf</button>
  <div class="note">Paparan baca sahaja. Setiap pemantauan direkodkan dalam Log Aktiviti anda dan staf berkenaan.</div>
  <div class="chips" id="chips"></div>
  <div class="count" id="count"></div>
  <div id="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</main>
<div class="loading" id="busy">Membuka paparan staf…</div>
<div class="toast" id="toast"></div>
<div class="sheetbg" id="annBg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Hantar pengumuman">
  <h3>📣 Pengumuman</h3>
  <label>Kepada</label><select id="annAud"></select>
  <label>Templat pantas</label>
  <div class="tpl" id="annTpl">
    <button data-t="Mesyuarat" data-m="Mesyuarat pada [hari], [masa] di [tempat]. Kehadiran diwajibkan.">Mesyuarat</button>
    <button data-t="Peringatan" data-m="Sila ambil perhatian: ">Peringatan</button>
    <button data-t="Perubahan jadual" data-m="Terdapat perubahan jadual bertugas. Sila semak jadual terkini dalam SIAGA.">Jadual</button>
    <button data-t="Makluman" data-m="">Makluman</button>
  </div>
  <label>Tajuk</label><input id="annTitle" maxlength="60" placeholder="cth: Mesyuarat Khamis ini">
  <label>Mesej</label><textarea id="annMsg" rows="4" maxlength="300" placeholder="Tulis mesej ringkas…"></textarea>
  <div class="cnt"><span id="annN">0</span>/300</div>
  <div class="lim" id="annLim"></div>
  <div class="srow"><button class="cancel" id="annCancel">Batal</button><button class="send" id="annSend">Hantar</button></div>
  <div class="recent" id="annRecent"></div>
</div></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxOamlCtYPlZCvQOys1VTjkZu7aVqMsdDStTdytPex7eH5jNGuIBiR91BfougaEF3SI/exec';
const token = sessionStorage.getItem('kkah_session_token');
if(!token || sessionStorage.getItem('kkah_view_name')){ location.href = './dashboard.html'; }

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(action, extra){
  const r = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({ action, token }, extra||{})) });
  return r.json();
}

let all = [], unit = '';
function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = all.filter(s => (!unit || s.unit === unit) && (!q || s.name.toLowerCase().includes(q)));
  document.getElementById('count').textContent = list.length + ' staf';
  document.getElementById('list').innerHTML = list.length ? list.map(s =>
    '<button class="person" data-ic="' + esc(s.ic) + '" data-name="' + esc(s.name) + '"><div class="av">' + esc(s.name.trim()[0] || '?') + '</div>' +
    '<div><div class="nm">' + esc(s.name) + '</div><div class="un">' + esc(s.unit || 'Tiada unit') + '</div></div><div class="go">›</div></button>').join('')
    : '<div class="empty">Tiada staf dijumpai.</div>';
}

document.getElementById('list').addEventListener('click', async e => {
  const b = e.target.closest('.person'); if(!b) return;
  document.getElementById('busy').classList.add('show');
  let d; try{ d = await api('startViewAs', { targetIc: b.dataset.ic }); }catch(err){ d = { ok:false, error:'Ralat sambungan.' }; }
  document.getElementById('busy').classList.remove('show');
  if(!d.ok){ alert(d.error || 'Gagal membuka paparan.'); return; }
  // keep the supervisor's own session so "Keluar" can restore it; this tab now shows the staff read-only
  sessionStorage.setItem('kkah_sup_token', token);
  sessionStorage.setItem('kkah_sup_role', sessionStorage.getItem('kkah_role') || '');
  sessionStorage.setItem('kkah_sup_ic', sessionStorage.getItem('kkah_ic') || '');
  sessionStorage.setItem('kkah_session_token', d.token);
  sessionStorage.setItem('kkah_role', 'staff');
  sessionStorage.setItem('kkah_ic', d.ic);
  sessionStorage.setItem('kkah_view_name', d.name);
  location.href = './dashboard.html';
});
document.getElementById('q').addEventListener('input', render);

/* ---- announcements ---- */
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
let annOpts = null;
const $ = id => document.getElementById(id);
document.getElementById('annOpen').onclick = async () => {
  $('annBg').classList.add('show');
  if(!annOpts){
    let d; try{ d = await api('getAnnounceOptions'); }catch(e){ d = { ok:false, error:'Ralat sambungan.' }; }
    if(!d.ok){ toast(d.error || 'Gagal'); $('annBg').classList.remove('show'); return; }
    annOpts = d;
  }
  $('annAud').innerHTML = annOpts.audiences.map(a => '<option value="' + esc(a.key) + '">' + esc(a.label) + ' (' + a.count + ' staf)</option>').join('');
  $('annLim').textContent = 'Dihantar hari ini: ' + annOpts.sentToday + '/' + annOpts.limit;
  $('annRecent').innerHTML = annOpts.recent.length ? '<b>Terkini dihantar</b>' + annOpts.recent.map(r => '<div style="margin-top:4px">' + esc(r.at.slice(5, 16)) + ' · ' + esc(r.audience) + ' · ' + esc(r.title) + '</div>').join('') : '';
};
$('annCancel').onclick = () => $('annBg').classList.remove('show');
$('annBg').onclick = e => { if(e.target === $('annBg')) $('annBg').classList.remove('show'); };
$('annMsg').oninput = () => { $('annN').textContent = $('annMsg').value.length; };
$('annTpl').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  $('annTitle').value = b.dataset.t; $('annMsg').value = b.dataset.m; $('annN').textContent = b.dataset.m.length; $('annMsg').focus();
};
$('annSend').onclick = async function(){
  const title = $('annTitle').value.trim(), message = $('annMsg').value.trim();
  if(!title || !message){ toast('Sila isi tajuk dan mesej'); return; }
  const opt = $('annAud').selectedOptions[0].textContent;
  if(!confirm('Hantar kepada ' + opt + '?\n\n' + title + '\n' + message)) return;
  this.disabled = true; this.textContent = 'Menghantar…';
  let d; try{ d = await api('sendAnnouncement', { audience: $('annAud').value, title, message }); }catch(e){ d = { ok:false, error:'Ralat sambungan.' }; }
  this.disabled = false; this.textContent = 'Hantar';
  if(!d.ok){ toast(d.error || 'Gagal menghantar'); return; }
  $('annBg').classList.remove('show'); $('annTitle').value = ''; $('annMsg').value = ''; $('annN').textContent = '0'; annOpts = null;
  toast('✓ Dihantar kepada ' + d.count + ' staf (' + d.audience + ')');
};

(async function init(){
  let d; try{ d = await api('listSupervisedStaff'); }catch(e){ d = { ok:false, error:'Ralat sambungan.' }; }
  if(!d.ok){ document.getElementById('list').innerHTML = '<div class="empty">' + esc(d.error) + '</div>'; return; }
  all = d.staff;
  document.getElementById('lvl').textContent = d.level === 'TOP' ? 'KETUA' : d.level === 'VIEW' ? 'PEMERHATI (SEMUA STAF)' : 'PENYELIA UNIT';
  if(d.units.length > 1){
    const chips = document.getElementById('chips');
    chips.innerHTML = '<button class="chip on" data-u="">Semua</button>' + d.units.map(u => '<button class="chip" data-u="' + esc(u) + '">' + esc(u) + '</button>').join('');
    chips.onclick = e => { const c = e.target.closest('.chip'); if(!c) return; unit = c.dataset.u; chips.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c)); render(); };
  }
  render();
})();
</script>
</body>
</html>
