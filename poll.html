<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F4530">
<title>Tanya &amp; Tinjau</title>
<link rel="icon" type="image/png" href="./siaga-192.png">
<style>
  :root{ --bg:#EEF3F1; --card:#fff; --ink:#16231F; --mut:#5E7069; --line:#D6E0DB; --acc:#1A6B4A; --acc2:#0F4530; --accl:#E3F0EB; --onacc:#0F4530;
    --dg:#C0392B; --dgl:#FBEAE7; --warn:#B45309; --warnl:#FFF4D6; --ok:#1f9a57; --okl:#E3F4EA; }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#0E1A17; --card:#15251F; --ink:#E7F1ED; --mut:#97ADA5; --line:#27403A; --accl:#17352B; --onacc:#A8EBCB;
    --dg:#FF9A8D; --dgl:#3a1d19; --warn:#F0B35A; --warnl:#3a2c14; --ok:#6fd49a; --okl:#17352B; } }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; } html,body{ margin:0; }
  body{ background:var(--bg); color:var(--ink); font-family:Inter,'Segoe UI',system-ui,sans-serif; min-height:100vh; padding-bottom:calc(110px + env(safe-area-inset-bottom)); line-height:1.4; }
  .top{ position:sticky; top:0; z-index:20; padding:calc(10px + env(safe-area-inset-top)) 14px 12px; background:linear-gradient(135deg,var(--acc2),var(--acc)); color:#fff; box-shadow:0 6px 18px -10px rgba(0,0,0,.5); }
  .top .row{ max-width:760px; margin:0 auto; display:flex; align-items:center; gap:10px; }
  .back{ width:40px; height:40px; border:none; border-radius:12px; background:rgba(255,255,255,.16); color:#fff; font-size:20px; cursor:pointer; }
  .ttl{ flex:1; font-weight:800; font-size:17px; line-height:1.15; } .ttl small{ display:block; font-weight:500; font-size:11.5px; opacity:.85; }
  .prog{ max-width:760px; margin:10px auto 0; height:5px; border-radius:99px; background:rgba(255,255,255,.28); overflow:hidden; } .prog i{ display:block; height:100%; width:0; background:#fff; transition:width .35s; }
  .wrap{ max-width:760px; margin:0 auto; padding:14px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:20px; padding:16px; margin-bottom:12px; box-shadow:0 8px 22px -16px rgba(0,0,0,.35); }
  h2{ margin:0 0 4px; font-size:18px; } .sub{ margin:0 0 12px; color:var(--mut); font-size:13px; }
  label,.lb{ display:block; font-size:12.5px; font-weight:700; margin:12px 0 5px; } label small,.lb small{ font-weight:500; color:var(--mut); } .req{ color:var(--dg); }
  input[type=text],input[type=tel],input[type=number],input[type=date],select,textarea{ width:100%; border-radius:14px; border:1.5px solid var(--line); background:var(--card); color:var(--ink); font:600 16px Inter,system-ui,sans-serif; padding:0 14px; height:50px; outline:none; appearance:none; -webkit-appearance:none; }
  textarea{ height:auto; min-height:84px; padding:12px 14px; resize:vertical; font-weight:500; }
  input:focus,select:focus,textarea:focus{ border-color:var(--acc); box-shadow:0 0 0 4px rgba(26,107,74,.16); }
  .bad{ border-color:var(--dg)!important; box-shadow:0 0 0 4px rgba(192,57,43,.14); animation:shake .3s; } @keyframes shake{ 25%{ transform:translateX(-5px); } 75%{ transform:translateX(5px); } }
  .mono{ font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace; letter-spacing:.1em; } .hint{ font-size:12px; color:var(--mut); margin-top:5px; min-height:16px; } .hint.err{ color:var(--dg); font-weight:700; }
  .g2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; } .g3{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .srch{ display:flex; gap:8px; } .srch input{ flex:1; min-width:0; height:54px; font-size:17px; }
  .btn{ min-width:92px; height:54px; border-radius:14px; border:none; background:linear-gradient(135deg,var(--acc2),var(--acc)); color:#fff; font:800 15px Inter,sans-serif; cursor:pointer; padding:0 14px; } .btn:disabled{ opacity:.55; }
  .btn2{ height:46px; border-radius:13px; border:1.5px solid var(--line); background:var(--card); color:var(--ink); font:800 13.5px Inter,sans-serif; padding:0 14px; cursor:pointer; }
  .link{ background:none; border:none; color:var(--onacc); font-weight:800; font-size:13px; padding:8px 0; cursor:pointer; text-decoration:underline; }
  .seg{ display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:8px; } .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .opt{ position:relative; } .opt input{ position:absolute; opacity:0; inset:0; width:100%; height:100%; cursor:pointer; margin:0; }
  .opt span{ display:flex; align-items:center; justify-content:center; text-align:center; min-height:48px; padding:6px 12px; border-radius:14px; border:1.5px solid var(--line); background:var(--card); font-weight:700; font-size:14px; transition:all .15s; }
  .opt input:checked + span{ border-color:var(--acc); background:var(--accl); color:var(--onacc); box-shadow:0 0 0 3px rgba(26,107,74,.14); }
  .opt.yes input:checked + span{ border-color:var(--dg); background:var(--dgl); color:var(--dg); } .opt.sm span{ min-height:42px; padding:4px 10px; font-size:13.5px; }
  .opt input:focus-visible + span{ outline:3px solid var(--acc); outline-offset:2px; }
  .pt{ border:1.5px solid var(--line); border-radius:16px; padding:12px 14px; display:flex; gap:12px; align-items:center; margin-top:10px; background:var(--card); }
  .pt .mid{ flex:1; min-width:0; } .pt b{ display:block; font-size:15px; word-break:break-word; } .pt small{ color:var(--mut); font-size:12.5px; }
  .pill{ display:inline-block; padding:3px 10px; border-radius:99px; font-size:11.5px; font-weight:800; } .pill.l0{ background:var(--okl); color:var(--ok); } .pill.l2{ background:var(--dgl); color:var(--dg); } .pill.l1{ background:var(--warnl); color:var(--warn); } .pill.na{ background:var(--accl); color:var(--mut); }
  .dots{ display:flex; gap:4px; margin-top:6px; } .dots i{ width:10px; height:10px; border-radius:50%; background:var(--line); } .dots i.l0{ background:var(--ok); } .dots i.l2{ background:var(--dg); } .dots i.na{ background:var(--mut); opacity:.5; }
  .empty{ text-align:center; color:var(--mut); padding:22px 10px; font-size:14px; }
  .dom{ scroll-margin-top:90px; } .dom .hd{ display:flex; align-items:center; gap:10px; margin-bottom:6px; } .dom .hd .ic{ font-size:24px; } .dom .hd b{ flex:1; font-size:16px; }
  .qtxt{ font-size:14px; margin:10px 0 6px; font-weight:600; } .qtxt small{ color:var(--mut); font-weight:500; display:block; }
  .sug{ margin-top:12px; padding:10px 12px; border-radius:14px; background:var(--bg); font-size:13px; } .sug b{ display:block; margin-bottom:2px; } .sug ul{ margin:4px 0 0; padding-left:18px; } .sug .nt{ color:var(--mut); }
  .sug.l0{ background:var(--okl); } .sug.l2{ background:var(--dgl); }
  .conf{ margin-top:10px; display:grid; grid-template-columns:1fr 1fr; gap:8px; } .conf.three{ grid-template-columns:1fr 1fr 1fr; }
  .conf button{ min-height:48px; border-radius:14px; border:2px dashed var(--line); background:var(--card); color:var(--ink); font:800 13.5px Inter,sans-serif; cursor:pointer; padding:6px 8px; }
  .conf button.sg{ border-color:var(--acc); } .conf button.on{ border-style:solid; color:#fff; } .conf button.on.l0{ background:var(--ok); border-color:var(--ok); color:#06210f; } .conf button.on.l2{ background:var(--dg); border-color:var(--dg); color:#2a0500; } .conf button.on.na{ background:var(--mut); border-color:var(--mut); color:#111; }
  .cfd{ font-size:12px; color:var(--mut); margin-top:6px; }
  .bar{ position:fixed; left:0; right:0; bottom:0; z-index:25; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(180deg,transparent,var(--bg) 30%); }
  .bar .in{ max-width:760px; margin:0 auto; display:flex; gap:10px; align-items:center; position:relative; } .bar .btn{ flex:1; height:56px; font-size:16px; } .status{ position:absolute; left:0; right:0; top:-26px; text-align:center; font-weight:700; font-size:13px; color:var(--dg); }
  .ovr{ padding:14px; border-radius:16px; font-weight:800; font-size:16px; text-align:center; margin:4px 0 6px; } .ovr.l0{ background:var(--okl); color:var(--ok); } .ovr.l2{ background:var(--dgl); color:var(--dg); } .ovr.na{ background:var(--bg); color:var(--mut); }
  .toast{ position:fixed; left:50%; bottom:100px; transform:translate(-50%,20px); background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:99px; font-weight:700; font-size:14px; opacity:0; pointer-events:none; transition:all .25s; z-index:50; max-width:90vw; } .toast.on{ opacity:1; transform:translate(-50%,0); }
  .view{ display:none; } .view.on{ display:block; } [hidden]{ display:none!important; }
  .spin{ width:22px; height:22px; border:3px solid var(--line); border-top-color:var(--acc); border-radius:50%; animation:sp .8s linear infinite; margin:0 auto 8px; } @keyframes sp{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important; } }
  .tabs{ display:grid; grid-template-columns:1fr 1fr; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:5px; margin-bottom:12px; }
  .tabs button{ height:44px; border:none; border-radius:12px; background:none; color:var(--mut); font:800 14px Inter,sans-serif; cursor:pointer; } .tabs button.on{ background:linear-gradient(135deg,var(--acc2),var(--acc)); color:#fff; }
  .pc{ display:block; width:100%; text-align:left; border:1.5px solid var(--line); border-radius:16px; background:var(--card); color:var(--ink); padding:13px 14px; margin-top:10px; cursor:pointer; font-family:inherit; }
  .pc b{ display:block; font-size:15px; margin:4px 0 2px; word-break:break-word; } .pc small{ color:var(--mut); font-size:12.5px; } .pc .r{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .tag{ display:inline-block; padding:2px 9px; border-radius:99px; font-size:11px; font-weight:800; background:var(--accl); color:var(--onacc); } .tag.new{ background:var(--warnl); color:var(--warn); } .tag.cl{ background:var(--bg); color:var(--mut); }
  .fab{ position:fixed; right:16px; bottom:calc(20px + env(safe-area-inset-bottom)); z-index:30; height:56px; padding:0 22px; border-radius:99px; border:none; background:linear-gradient(135deg,var(--acc2),var(--acc)); color:#fff; font:800 15px Inter,sans-serif; box-shadow:0 10px 24px -8px rgba(0,0,0,.5); cursor:pointer; }
  .kinds{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; } .kinds button{ border:1.5px solid var(--line); background:var(--card); color:var(--ink); border-radius:14px; padding:10px 4px; font:800 13px Inter,sans-serif; cursor:pointer; } .kinds button small{ display:block; font-weight:500; color:var(--mut); font-size:11px; margin-top:2px; } .kinds button.on{ border-color:var(--acc); background:var(--accl); color:var(--onacc); }
  .qb{ border:1.5px solid var(--line); border-radius:16px; padding:12px; margin-top:10px; background:var(--card); } .qb .h{ display:flex; gap:8px; align-items:center; } .qb .h b{ flex:1; font-size:13px; color:var(--mut); } .qb .rm{ border:none; background:var(--dgl); color:var(--dg); border-radius:10px; height:34px; width:34px; font-size:16px; cursor:pointer; }
  .qb textarea{ min-height:64px; margin-top:6px; } .qb select{ height:44px; font-size:14px; } .chk{ display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600; margin-top:10px; } .chk input{ width:20px; height:20px; accent-color:var(--acc); }
  .stars{ display:flex; gap:6px; } .stars button{ flex:1; height:50px; border-radius:14px; border:1.5px solid var(--line); background:var(--card); font-size:22px; cursor:pointer; filter:grayscale(1); opacity:.55; transition:all .15s; } .stars button.on{ filter:none; opacity:1; border-color:var(--warn); background:var(--warnl); }
  .ob{ position:relative; border-radius:12px; border:1.5px solid var(--line); overflow:hidden; margin-top:8px; min-height:42px; display:flex; align-items:center; padding:0 12px; font-size:14px; font-weight:700; } .ob i{ position:absolute; left:0; top:0; bottom:0; background:var(--accl); width:0; transition:width .6s; z-index:0; } .ob span{ position:relative; z-index:1; flex:1; } .ob em{ position:relative; z-index:1; font-style:normal; color:var(--mut); font-size:13px; }
  .rsp{ border-top:1px dashed var(--line); padding:9px 0; font-size:13.5px; } .rsp b{ display:block; } .rsp small{ color:var(--mut); }
  .note{ font-size:12.5px; color:var(--mut); background:var(--bg); border-radius:12px; padding:9px 12px; margin-top:10px; }
  .row2{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; } .row2 .btn2{ flex:1; min-width:110px; } .btn2.dg{ color:var(--dg); border-color:var(--dg); }
  .qrow{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; } .qrow button{ border:1.5px solid var(--line); background:var(--card); color:var(--ink); border-radius:99px; padding:7px 12px; font:700 12.5px Inter,sans-serif; cursor:pointer; }
</style>
<script src="./version.js"></script>
<script src="./version-ui.js"></script>

<body>
<div class="top"><div class="row"><button class="back" id="backBtn" onclick="goBack()" aria-label="Kembali">←</button>
  <div class="ttl">Tanya &amp; Tinjau<small id="sub">Soalan · undian · maklum balas</small></div></div></div>
<div class="wrap">
<section class="view on" id="vList">
  <div class="tabs" role="tablist"><button id="tA" class="on" onclick="tab('forMe')">Untuk saya <span id="nA"></span></button><button id="tB" onclick="tab('mine')">Saya cipta <span id="nB"></span></button></div>
  <div id="list"><div class="empty"><div class="spin"></div>Memuatkan…</div></div>
</section>

<section class="view" id="vNew">
  <div class="card"><h2>Cipta baharu</h2><p class="sub">Pilih jenis, tulis soalan, pilih siapa yang menerima.</p>
    <div class="kinds" id="kinds"><button data-k="Soalan" class="on">❓ Soalan<small>jawapan ringkas</small></button><button data-k="Undian">📊 Undian<small>pilih satu</small></button><button data-k="Tinjauan">📝 Tinjauan<small>beberapa soalan</small></button></div>
    <label for="ttl">Tajuk <span class="req">*</span></label><input type="text" id="ttl" maxlength="120" placeholder="cth. Makan tengah hari Jumaat ini?">
    <label for="dsc">Keterangan <small>(tidak wajib)</small></label><textarea id="dsc" maxlength="500" rows="2"></textarea></div>
  <div class="card"><h2>Soalan</h2><div id="qs"></div><button class="btn2" id="addQ" onclick="addQ()" style="width:100%;margin-top:10px">＋ Tambah soalan</button></div>
  <div class="card"><h2>Penerima</h2>
    <div class="seg"><label class="opt"><input type="radio" name="aud" value="ALL" checked><span>Semua staf</span></label><label class="opt"><input type="radio" name="aud" value="UNITS"><span>Pilih unit</span></label></div>
    <div class="chips" id="units" style="margin-top:10px" hidden></div>
    <label for="cls">Tutup pada <small>(tidak wajib)</small></label><input type="datetime-local" id="cls">
    <div class="qrow" id="qc"><button data-h="1">1 jam</button><button data-h="24">1 hari</button><button data-h="72">3 hari</button><button data-h="168">7 hari</button><button data-h="0">Tiada</button></div>
    <label class="chk"><input type="checkbox" id="shr"> Tunjuk keputusan kepada mereka yang telah menjawab</label>
    <div class="note">🔔 Penerima akan dimaklumkan. Jawapan dipaparkan <b>bersama nama</b>, dan anda dimaklumkan setiap kali ada jawapan baharu.</div></div>
</section>

<section class="view" id="vDet"><div id="det"></div></section>
</div>
<button class="fab" id="fab" onclick="openNew()">＋ Baharu</button>
<div class="bar" id="bar" hidden><div class="in"><div class="status" id="status" role="status" aria-live="polite"></div><button class="btn" id="act" onclick="act()">Hantar</button></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxOamlCtYPlZCvQOys1VTjkZu7aVqMsdDStTdytPex7eH5jNGuIBiR91BfougaEF3SI/exec';
const token = sessionStorage.getItem('kkah_session_token'), $ = id => document.getElementById(id);
const VIA_QR = sessionStorage.getItem('kkah_via') === 'qr', DESKTOP = !/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
const DEEP = new URLSearchParams(location.search).get('id') || '';
function toLogin(){ location.replace((VIA_QR || DESKTOP) ? './qr-login.html?next=poll.html' : './login.html'); }
if (!token) toLogin();
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast._h); toast._h = setTimeout(() => t.classList.remove('on'), 3200); }
function api(body, ms){ const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms || 30000);
  return fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ token }, body)), signal: ctl.signal }).then(r => r.json()).finally(() => clearTimeout(t)); }
const expired = r => r && /expired|tidak tersedia pada log masuk/i.test(r.error || '');
const call = async (b, ms) => { try { return await api(b, ms); } catch(e){ return { ok:false, error:'Sambungan gagal. Cuba lagi.' }; } };
function flash(m){ const s = $('status'); s.textContent = m || ''; if (m) setTimeout(() => { if (s.textContent === m) s.textContent = ''; }, 4500); }
let view = 'list', TAB = 'forMe', DATA = { forMe:[], mine:[] }, CUR = null, ANS = {}, saving = false, dirty = false, KIND = 'Soalan', Q = [], UNITS = [], myUnit = '';
const TYPES = [['text','Jawapan ringkas'],['single','Pilih satu'],['multi','Pilih beberapa'],['rating','Penilaian ★ 1–5']];

function show(v){ view = v; ['List','New','Det'].forEach(n => $('v' + n).classList.toggle('on', v === n.toLowerCase())); $('fab').hidden = v !== 'list'; $('bar').hidden = !(v === 'new' || (v === 'det' && CUR && !CUR.creator && CUR.poll.open)); window.scrollTo({ top:0 });
  $('sub').textContent = v === 'new' ? 'Cipta baharu' : v === 'det' ? (CUR ? CUR.poll.kind : '') : 'Soalan · undian · maklum balas'; }
function goBack(){ if (view !== 'list'){ if (dirty && !confirm('Keluar tanpa menyimpan?')) return; dirty = false; show('list'); load(); return; } if (VIA_QR){ return; } location.href = './dashboard.html'; }

/* ---------- list ---------- */
function tab(t){ TAB = t; $('tA').classList.toggle('on', t === 'forMe'); $('tB').classList.toggle('on', t === 'mine'); draw(); }
async function load(){
  const r = await call({ action:'pollList' }); if (expired(r)) return toLogin();
  if (!r.ok){ $('list').innerHTML = '<div class="empty">' + esc(r.error || 'Gagal memuatkan') + '</div>'; return; }
  DATA = r; const todo = r.forMe.filter(p => p.open && !p.answered).length; $('nA').textContent = todo ? '(' + todo + ')' : ''; $('nB').textContent = r.mine.length ? '(' + r.mine.length + ')' : ''; draw();
}
function draw(){
  const rows = DATA[TAB] || [];
  $('list').innerHTML = rows.length ? rows.map(p => '<button class="pc" data-id="' + esc(p.id) + '"><div class="r"><span class="tag">' + esc(p.kind) + '</span>' + (!p.open ? '<span class="tag cl">Ditutup</span>' : '') + (TAB === 'forMe' && p.open && !p.answered ? '<span class="tag new">Belum dijawab</span>' : '') + (TAB === 'forMe' && p.answered ? '<span class="tag">✓ Dijawab</span>' : '') + '</div><b>' + esc(p.title) + '</b><small>' + (TAB === 'forMe' ? esc(p.by) + ' · ' : '') + esc(p.at.slice(0, 16)) + (p.closes && p.open ? ' · tutup ' + esc(p.closes) : '') + (TAB === 'mine' ? ' · ' + p.count + ' jawapan' : '') + '</small></button>').join('')
    : '<div class="empty">' + (TAB === 'forMe' ? 'Tiada soalan untuk anda buat masa ini.' : 'Anda belum mencipta apa-apa.<br>Tekan “＋ Baharu”.') + '</div>';
}
$('list').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) openPoll(b.dataset.id); });

/* ---------- create ---------- */
const newQ = t => ({ t:'', type:t || 'text', opts:'', req:true });
function setKind(k){ KIND = k; document.querySelectorAll('#kinds button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  if (!Q.length || Q.every(q => !q.t && !q.opts)) Q = [newQ(k === 'Undian' ? 'single' : 'text')]; $('addQ').hidden = k !== 'Tinjauan'; if (k !== 'Tinjauan') Q = Q.slice(0, 1); drawQ(); }
$('kinds').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) { if (b.dataset.k === 'Undian' && Q.length === 1 && Q[0].type === 'text' && !Q[0].t) Q[0].type = 'single'; if (b.dataset.k === 'Soalan' && Q.length === 1 && Q[0].type === 'single' && !Q[0].t) Q[0].type = 'text'; setKind(b.dataset.k); dirty = true; } });
function drawQ(){
  $('qs').innerHTML = Q.map((q, i) => '<div class="qb"><div class="h"><b>Soalan ' + (i + 1) + '</b>' + (Q.length > 1 ? '<button class="rm" data-rm="' + i + '" aria-label="Buang">✕</button>' : '') + '</div>' +
    '<textarea data-q="' + i + '" data-f="t" maxlength="200" rows="2" placeholder="Tulis soalan anda">' + esc(q.t) + '</textarea>' +
    '<select data-q="' + i + '" data-f="type" aria-label="Jenis jawapan">' + TYPES.map(t => '<option value="' + t[0] + '"' + (q.type === t[0] ? ' selected' : '') + '>' + t[1] + '</option>').join('') + '</select>' +
    (q.type === 'single' || q.type === 'multi' ? '<textarea data-q="' + i + '" data-f="opts" maxlength="700" rows="3" placeholder="Satu pilihan setiap baris (2–8)">' + esc(q.opts) + '</textarea>' : '') +
    '<label class="chk"><input type="checkbox" data-q="' + i + '" data-f="req"' + (q.req ? ' checked' : '') + '> Wajib dijawab</label></div>').join('');
}
$('qs').addEventListener('input', e => { const el = e.target, i = el.dataset.q; if (i == null) return; const f = el.dataset.f; Q[+i][f] = f === 'req' ? el.checked : el.value; dirty = true; });
$('qs').addEventListener('change', e => { const el = e.target; if (el.dataset.f === 'type'){ drawQ(); } });
$('qs').addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (b){ Q.splice(+b.dataset.rm, 1); drawQ(); } });
function addQ(){ if (Q.length >= 10) return toast('Maksimum 10 soalan'); Q.push(newQ('text')); drawQ(); dirty = true; }
document.querySelectorAll('input[name=aud]').forEach(r => r.addEventListener('change', () => { $('units').hidden = document.querySelector('input[name=aud]:checked').value !== 'UNITS'; dirty = true; }));
$('qc').addEventListener('click', e => { const b = e.target.closest('[data-h]'); if (!b) return; const h = +b.dataset.h; if (!h){ $('cls').value = ''; return; } const d = new Date(Date.now() + h * 3600000), p = n => String(n).padStart(2, '0'); $('cls').value = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); dirty = true; });
async function openNew(){
  Q = []; KIND = 'Soalan'; $('ttl').value = ''; $('dsc').value = ''; $('cls').value = ''; $('shr').checked = false; document.querySelector('input[name=aud][value=ALL]').checked = true; $('units').hidden = true; dirty = false;
  setKind('Soalan'); show('new'); $('act').textContent = 'Hantar & maklumkan';
  if (!UNITS.length){ const r = await call({ action:'pollUnits' }); if (expired(r)) return toLogin(); if (r.ok){ UNITS = r.units; myUnit = r.myUnit; $('units').innerHTML = UNITS.map(u => '<label class="opt sm"><input type="checkbox" name="un" value="' + esc(u) + '"><span>' + esc(u) + '</span></label>').join(''); } }
}
async function submitNew(){
  const title = $('ttl').value.trim(); if (title.length < 3) { flash('Sila tulis tajuk.'); $('ttl').focus(); return; }
  const items = []; for (let i = 0; i < Q.length; i++){ const q = Q[i], it = { t:q.t.trim(), type:q.type, req:q.req }; if (!it.t){ flash('Soalan ' + (i + 1) + ' belum ditulis.'); return; }
    if (q.type === 'single' || q.type === 'multi'){ it.opts = q.opts.split('\n').map(x => x.trim()).filter(Boolean); if (it.opts.length < 2 || it.opts.length > 8){ flash('Soalan ' + (i + 1) + ': 2 hingga 8 pilihan (satu setiap baris).'); return; } } items.push(it); }
  const useUnits = document.querySelector('input[name=aud]:checked').value === 'UNITS', units = [...document.querySelectorAll('input[name=un]:checked')].map(c => c.value);
  if (useUnits && !units.length){ flash('Pilih sekurang-kurangnya satu unit.'); return; }
  const poll = { kind:KIND, title, desc:$('dsc').value.trim(), items, units: useUnits ? units : [], closes:$('cls').value, share:$('shr').checked ? 'Y' : 'N' };
  saving = true; $('act').disabled = true; $('act').textContent = 'Menghantar…'; const r = await call({ action:'pollCreate', poll }); saving = false; $('act').disabled = false; $('act').textContent = 'Hantar & maklumkan';
  if (expired(r)) return toLogin(); if (!r.ok){ flash(r.error || 'Gagal menghantar.'); return; }
  dirty = false; toast('✓ Dihantar' + (r.notified ? ' · ' + r.notified + ' orang dimaklumkan' : '')); show('list'); tab('mine'); await load(); tab('mine');
}

/* ---------- detail ---------- */
async function openPoll(id){
  toast('Membuka…'); const r = await call({ action:'pollGet', id }); if (expired(r)) return toLogin(); if (!r.ok) return toast(r.error || 'Gagal membuka');
  CUR = r; ANS = {}; const m = r.mine || {}; Object.keys(m).forEach(k => { ANS[k] = m[k]; }); dirty = false; paintDet(); show('det'); $('act').textContent = r.mine ? 'Kemas kini jawapan' : 'Hantar jawapan';
}
const stars = (i, v) => '<div class="stars" data-qi="' + i + '">' + [1,2,3,4,5].map(n => '<button type="button" data-v="' + n + '" class="' + (v >= n ? 'on' : '') + '" aria-label="' + n + ' bintang">⭐</button>').join('') + '</div>';
function bars(it, g){ if (!g || it.type === 'text') return ''; const tot = it.type === 'rating' ? g.n : (it.type === 'multi' ? g.n : g.n) || 0;
  const labels = it.type === 'rating' ? ['1 ⭐','2 ⭐','3 ⭐','4 ⭐','5 ⭐'] : it.opts;
  return (it.type === 'rating' ? '<div class="sub" style="margin:8px 0 0">Purata <b>' + g.avg + '</b> / 5 · ' + g.n + ' penilaian</div>' : '') + labels.map((l, k) => { const c = g.counts[k] || 0, pc = tot ? Math.round(c / tot * 100) : 0; return '<div class="ob"><i style="width:' + pc + '%"></i><span>' + esc(l) + '</span><em>' + c + ' · ' + pc + '%</em></div>'; }).join(''); }
function paintDet(){
  const r = CUR, p = r.poll; let h = '<div class="card"><div class="r" style="display:flex;gap:6px;flex-wrap:wrap"><span class="tag">' + esc(p.kind) + '</span>' + (!p.open ? '<span class="tag cl">Ditutup</span>' : '') + '</div><h2 style="margin-top:8px">' + esc(p.title) + '</h2>' +
    '<div class="sub">' + esc(p.by) + ' · ' + esc(p.at) + (p.closes && p.open ? ' · tutup ' + esc(p.closes) : '') + ' · ' + p.count + ' jawapan</div>' + (p.desc ? '<p style="margin:0;font-size:14px">' + esc(p.desc) + '</p>' : '') + '</div>';
  if (r.creator || r.agg){ // results
    if (r.creator){ h += '<div class="row2"><button class="btn2" onclick="refreshDet()">↻ Muat semula</button>' + (p.open ? '<button class="btn2" onclick="setSt(\'CLOSED\')">⏹ Tutup</button>' : '<button class="btn2" onclick="setSt(\'OPEN\')">▶ Buka semula</button>') + '<button class="btn2 dg" onclick="setSt(\'DELETED\')">🗑 Padam</button></div>'; }
    h += p.items.map((it, i) => '<div class="card"><div class="qtxt">' + (i + 1) + '. ' + esc(it.t) + '</div>' + bars(it, r.agg && r.agg[i]) +
      (it.type === 'text' && r.creator ? (r.responses.filter(x => x.ans[i]).map(x => '<div class="rsp"><b>' + esc(x.ans[i]) + '</b><small>' + esc(x.name) + ' · ' + esc(x.at.slice(11)) + '</small></div>').join('') || '<div class="empty">Belum ada jawapan.</div>') : '') + '</div>').join('');
    if (r.creator){ h += '<div class="card"><h2>Siapa menjawab</h2><div class="sub">' + r.responses.length + ' menjawab' + (r.pending ? ' · ' + r.pending.length + ' belum' : '') + '</div>' + r.responses.map(x => '<div class="rsp"><b>' + esc(x.name) + '</b><small>' + esc(x.at) + (p.items.length ? ' — ' + p.items.map((it, i) => { const v = x.ans[i]; return v == null ? '' : esc(it.type === 'single' ? it.opts[v] : it.type === 'multi' ? v.map(k => it.opts[k]).join(', ') : it.type === 'rating' ? v + '★' : v); }).filter(Boolean).join(' · ') : '') + '</small></div>').join('') +
      (r.pending && r.pending.length ? '<details style="margin-top:10px"><summary style="font-weight:700;cursor:pointer">Belum menjawab (' + r.pending.length + ')</summary><div class="note">' + r.pending.map(esc).join(', ') + '</div></details>' : '') + '</div>'; }
  }
  if (!r.creator){
    if (p.open){ h += '<div class="note">🔔 Jawapan anda dipaparkan kepada pencipta <b>bersama nama anda</b>.' + (r.mine ? ' Anda boleh mengubah jawapan selagi belum ditutup.' : '') + '</div>';
      h += p.items.map((it, i) => '<div class="card"><div class="qtxt">' + (i + 1) + '. ' + esc(it.t) + (it.req ? ' <span class="req">*</span>' : '') + '</div>' + (it.type === 'text' ? '<textarea data-ai="' + i + '" maxlength="400" rows="3" placeholder="Jawapan anda">' + esc(ANS[i] || '') + '</textarea>'
        : it.type === 'rating' ? stars(i, ANS[i] || 0) : '<div class="chips">' + it.opts.map((o, k) => '<label class="opt"><input type="' + (it.type === 'single' ? 'radio' : 'checkbox') + '" name="a' + i + '" data-ai="' + i + '" value="' + k + '"' + ((it.type === 'single' ? ANS[i] === k : (ANS[i] || []).indexOf(k) !== -1) ? ' checked' : '') + '><span>' + esc(o) + '</span></label>').join('') + '</div>') + '</div>').join(''); }
    else if (!r.mine) h += '<div class="card"><div class="empty">Telah ditutup. Anda tidak menjawab.</div></div>';
    if (!p.open && r.mine) h += '<div class="note">✓ Anda telah menjawab.</div>';
  }
  $('det').innerHTML = h;
}
$('det').addEventListener('input', e => { const el = e.target; if (el.dataset.ai == null) return; const i = +el.dataset.ai, it = CUR.poll.items[i]; dirty = true;
  if (it.type === 'text') ANS[i] = el.value; else if (it.type === 'single') ANS[i] = +el.value; else ANS[i] = [...document.querySelectorAll('input[name=a' + i + ']:checked')].map(c => +c.value); });
$('det').addEventListener('click', e => { const b = e.target.closest('.stars button'); if (!b) return; const i = +b.parentNode.dataset.qi, v = +b.dataset.v; ANS[i] = v; dirty = true; b.parentNode.querySelectorAll('button').forEach((x, k) => x.classList.toggle('on', k < v)); });
async function refreshDet(){ await openPoll(CUR.poll.id); }
async function setSt(st){ if (st === 'DELETED' && !confirm('Padam ini? Jawapan tidak dapat dilihat lagi.')) return; if (st === 'CLOSED' && !confirm('Tutup sekarang? Tiada jawapan baharu diterima.')) return;
  const r = await call({ action:'pollSetStatus', id:CUR.poll.id, status:st }); if (expired(r)) return toLogin(); if (!r.ok) return toast(r.error || 'Gagal'); toast(st === 'DELETED' ? 'Dipadam' : st === 'CLOSED' ? 'Ditutup' : 'Dibuka semula'); dirty = false; if (st === 'DELETED'){ show('list'); load(); } else refreshDet(); }
async function submitAns(){
  const items = CUR.poll.items; for (let i = 0; i < items.length; i++){ const v = ANS[i], it = items[i], empty = v == null || v === '' || (Array.isArray(v) && !v.length); if (it.req && empty){ flash('Soalan ' + (i + 1) + ' wajib dijawab.'); document.querySelectorAll('#det .card')[i + 1].scrollIntoView({ block:'center', behavior:'smooth' }); return; } }
  saving = true; $('act').disabled = true; $('act').textContent = 'Menghantar…'; const r = await call({ action:'pollAnswer', id:CUR.poll.id, ans:ANS }); saving = false; $('act').disabled = false;
  if (expired(r)) return toLogin(); if (!r.ok){ $('act').textContent = 'Hantar jawapan'; flash(r.error || 'Gagal menghantar.'); return; }
  dirty = false; if (navigator.vibrate) navigator.vibrate(60); toast(r.updated ? '✓ Jawapan dikemas kini' : '✓ Terima kasih! Jawapan dihantar'); await openPoll(CUR.poll.id);
}
function act(){ if (saving) return; view === 'new' ? submitNew() : submitAns(); }
window.addEventListener('beforeunload', e => { if (dirty && view !== 'list'){ e.preventDefault(); e.returnValue = ''; } });
(async () => { await load(); if (DEEP) openPoll(DEEP); })();
</script>
</body>
</html>
