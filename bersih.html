<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIAGA · BERSIH</title>
<link rel="icon" type="image/png" href="./siaga-192.png?v=1.21.1">
<link rel="apple-touch-icon" href="./siaga-512.png?v=1.21.1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SIAGA">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0B3D3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-900:#0B3D3A; --teal-700:#0F5C56; --teal-500:#1C8F84; --mint-100:#EAF6F2; --mint-050:#F6FBF9;
    --gold-500:#C9A227; --green-500:#2FAE60; --green-700:#0a8f5a; --red-600:#C62839;
    --ink-700:#1E2B29; --ink-500:#5B6B68; --line:#DCEAE6;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; min-height:100vh; background:radial-gradient(1200px 800px at 50% -10%, var(--mint-100), var(--mint-050)); font-family:'Inter',sans-serif; color:var(--ink-700); padding:14px 14px 70px; }
  .wrap{ max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  .head{ border-radius:24px; padding:18px 20px; color:#fff; background:linear-gradient(135deg,var(--teal-900),var(--teal-700)); display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .head .eyebrow{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.75; font-weight:700; }
  .head h1{ font-family:'Manrope',sans-serif; font-size:21px; font-weight:800; margin:3px 0 0; }
  .head small{ display:block; font-size:12px; opacity:.8; margin-top:2px; }
  .back{ color:#fff; text-decoration:none; font-weight:700; font-size:13px; padding:9px 14px; border-radius:99px; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.3); white-space:nowrap; }

  .seg{ display:grid; grid-template-columns:repeat(var(--n,2),1fr); gap:4px; background:#fff; border:1px solid var(--line); border-radius:16px; padding:4px; }
  .seg button{ height:44px; border:none; border-radius:12px; background:none; font:inherit; font-weight:800; font-size:13.5px; color:var(--ink-500); cursor:pointer; }
  .seg button.on{ background:linear-gradient(135deg,var(--teal-900),var(--teal-500)); color:#fff; }

  .prog{ background:#fff; border:1px solid var(--line); border-radius:20px; padding:14px 16px; display:flex; align-items:center; gap:14px; }
  .ring{ --p:0; width:62px; height:62px; border-radius:50%; background:conic-gradient(var(--green-500) calc(var(--p)*1%), var(--mint-100) 0); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .ring i{ width:48px; height:48px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font:800 14px 'Manrope',sans-serif; font-style:normal; color:var(--teal-900); }
  .prog b{ font-family:'Manrope',sans-serif; font-size:16px; } .prog span{ display:block; font-size:12.5px; color:var(--ink-500); margin-top:2px; }

  .pick{ width:100%; height:50px; border-radius:14px; border:1.5px solid var(--line); background:#fff; font:inherit; font-size:15px; font-weight:700; padding:0 12px; color:var(--ink-700); }
  .ro{ background:#FFF3D6; color:#8a6d0a; font-weight:700; font-size:13px; padding:10px 14px; border-radius:14px; }

  .task{ background:#fff; border:1.5px solid var(--line); border-radius:18px; padding:12px 14px; display:flex; align-items:center; gap:12px; margin-bottom:10px; box-shadow:0 10px 26px -24px rgba(11,61,58,.55); }
  .task.done{ background:#F1FBF5; border-color:#BFE8CF; }
  .chk{ width:46px; height:46px; border-radius:14px; border:2px solid var(--line); background:var(--mint-050); display:flex; align-items:center; justify-content:center; font-size:22px; cursor:pointer; flex-shrink:0; color:transparent; }
  .task.done .chk{ background:var(--green-500); border-color:var(--green-500); color:#fff; cursor:default; }
  .chk:active{ transform:scale(.92); }
  .tm{ flex:1; min-width:0; } .tn{ font-weight:800; font-size:14px; line-height:1.3; font-family:'Manrope',sans-serif; }
  .tf{ font-size:11.5px; color:var(--ink-500); margin-top:4px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .fq{ padding:2px 9px; border-radius:99px; font-weight:800; font-size:10.5px; background:#E0F2FE; color:#0369A1; }
  .fq.MINGGUAN{ background:#EDE9FE; color:#6D28D9; } .fq.BULANAN{ background:#FEF3C7; color:#92400E; } .fq.X2_BULANAN{ background:#FCE7F3; color:#9D174D; }
  .ts{ font-size:11.5px; color:var(--green-700); font-weight:700; margin-top:3px; } .nt{ font-size:11.5px; color:var(--ink-500); font-style:italic; }

  .empty{ text-align:center; padding:34px 12px; color:var(--ink-500); font-size:14px; line-height:1.6; }
  .spin{ width:30px; height:30px; margin:0 auto 10px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--teal-500); animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .mnav{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:10px; display:flex; align-items:center; gap:10px; }
  .mnav button{ width:44px; height:44px; border-radius:12px; border:1.5px solid var(--line); background:var(--mint-050); font-size:18px; cursor:pointer; }
  .mnav div{ flex:1; text-align:center; font:800 16px 'Manrope',sans-serif; color:var(--teal-900); }
  .rwrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:12px; background:#fff; border:1px solid var(--line); }
  .rt{ border-collapse:collapse; font-size:10px; min-width:100%; }
  .rt th,.rt td{ border:1px solid #D5E8E3; padding:5px 4px; text-align:center; white-space:nowrap; }
  .rt thead th{ background:var(--teal-900); color:#fff; } .rt .tc{ text-align:left; white-space:normal; min-width:130px; max-width:150px; font-weight:700; background:var(--mint-050); font-size:9.5px; position:sticky; left:0; }
  .rt thead .tc{ background:var(--teal-900); color:#fff; font-size:11px; }
  .rt .sc{ background:var(--mint-100); color:var(--teal-700); font-size:9px; } .rt .c{ color:var(--green-700); font-weight:800; font-size:12px; } .rt .na{ background:#f3f4f4; }

  .btn{ height:52px; border-radius:15px; border:none; font:inherit; font-weight:800; font-size:15px; cursor:pointer; }
  .btn.ghost{ background:#fff; border:1.5px solid var(--line); color:var(--ink-700); }
  .btn.primary{ background:linear-gradient(135deg,var(--teal-900),var(--teal-500)); color:#fff; }
  .btn:disabled{ opacity:.55; }
  .row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .sheet{ position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.5); display:none; align-items:flex-end; justify-content:center; padding:14px; overflow:auto; }
  .sheet.show{ display:flex; }
  .box{ width:min(520px,100%); background:#fff; border-radius:24px; padding:20px 18px 16px; margin:auto 0 0; }
  .box h3{ margin:0 0 2px; font-family:'Manrope',sans-serif; font-size:18px; } .box p{ margin:0 0 6px; font-size:13px; color:var(--ink-500); }
  label{ display:block; font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-500); margin:13px 0 6px; }
  input[type=text]{ width:100%; height:48px; border-radius:12px; border:1.5px solid var(--line); padding:0 13px; font:inherit; font-size:15px; }
  input:focus,select:focus{ outline:none; border-color:var(--teal-500); box-shadow:0 0 0 3px rgba(28,143,132,.15); }
  .acts{ display:grid; grid-template-columns:1fr 1.4fr; gap:10px; margin-top:18px; }
  .hint{ font-size:12px; color:var(--ink-500); line-height:1.5; margin-top:8px; }

  .toast{ position:fixed; left:50%; bottom:22px; transform:translate(-50%,30px); background:var(--teal-900); color:#fff; font-weight:700; font-size:14px; padding:13px 20px; border-radius:99px; box-shadow:0 16px 30px -12px rgba(0,0,0,.4); opacity:0; transition:all .25s; z-index:90; pointer-events:none; max-width:90vw; text-align:center; }
  .toast.show{ opacity:1; transform:translate(-50%,0); } .toast.err{ background:var(--red-600); }
  .hide{ display:none !important; }
  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }
</style>
<script src="./version.js"></script>
<script src="./version-ui.js"></script>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><div class="eyebrow">Building Environment &amp; Routine Sanitation Inspection Hub</div><h1>BERSIH</h1><small id="who">Memuatkan…</small></div>
    <a class="back" href="./dashboard.html">← Dashboard</a>
  </div>

  <select class="pick hide" id="people" onchange="pickPerson()"></select>
  <div class="ro hide" id="ro">👁 Paparan penyelia — baca sahaja</div>

  <div class="seg" id="mainSeg"><button class="on" data-v="today" onclick="view('today')">📋 Hari ini</button><button data-v="report" onclick="view('report')">📊 Laporan</button></div>

  <!-- TODAY -->
  <div id="vToday">
    <div class="prog"><div class="ring" id="ring"><i id="ringTxt">0%</i></div><div><b id="progTitle">—</b><span id="progSub"></span></div></div>
    <div class="seg" id="tabSeg" style="--n:3;margin-top:14px"><button data-t="PAGI" onclick="tab('PAGI')">☀️ Pagi</button><button data-t="PETANG" onclick="tab('PETANG')">🌙 Petang</button><button data-t="ALL" onclick="tab('ALL')">📋 Semua</button></div>
    <div id="list" style="margin-top:14px"><div class="empty"><div class="spin"></div>Memuatkan tugasan…</div></div>
  </div>

  <!-- REPORT -->
  <div id="vReport" class="hide">
    <div class="mnav"><button onclick="chMonth(-1)">‹</button><div id="mLabel">—</div><button onclick="chMonth(1)">›</button></div>
    <div class="row" style="margin-top:12px"><button class="btn primary" onclick="loadReport()">Papar laporan</button><button class="btn ghost" id="btnPrint" onclick="printReport()" disabled>🖨 Cetak / PDF</button></div>
    <div id="rep" style="margin-top:14px"></div>
    <button class="btn ghost hide" id="btnSet" style="width:100%;margin-top:12px" onclick="openSet()">⚙️ Tetapan laporan (penyelia)</button>
  </div>
</div>

<div class="sheet" id="noteSheet"><div class="box">
  <h3>✅ Tandakan selesai</h3><p id="noteLbl"></p>
  <label for="noteIn">Nota (pilihan)</label><input type="text" id="noteIn" maxlength="200" placeholder="Tambah nota jika perlu…">
  <div class="acts"><button class="btn ghost" onclick="closeNote()">Batal</button><button class="btn primary" id="noteOk" onclick="confirmCheck()">Tandakan selesai</button></div>
</div></div>

<div class="sheet" id="setSheet"><div class="box">
  <h3>Tetapan laporan</h3><p>Tertera pada laporan bulanan yang dicetak.</p>
  <label for="sOrg">Nama organisasi / klinik</label><input type="text" id="sOrg">
  <label for="sSup">Nama penyelia</label><input type="text" id="sSup">
  <label for="sSig">URL tandatangan (gambar PNG di Drive)</label><input type="text" id="sSig" placeholder="https://drive.google.com/uc?export=view&amp;id=…">
  <label for="sStamp">URL cop rasmi (gambar PNG di Drive)</label><input type="text" id="sStamp" placeholder="https://drive.google.com/uc?export=view&amp;id=…">
  <div class="acts"><button class="btn ghost" onclick="$('setSheet').classList.remove('show')">Batal</button><button class="btn primary" id="sSave" onclick="saveSet()">Simpan</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxOamlCtYPlZCvQOys1VTjkZu7aVqMsdDStTdytPex7eH5jNGuIBiR91BfougaEF3SI/exec';
const $ = id => document.getElementById(id);
const token = sessionStorage.getItem('kkah_session_token');
if(!token) location.href = './login.html';
const MONTHS = ['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
const FREQ = { HARIAN:'2× sehari', MINGGUAN:'1× seminggu', '2X_BULANAN':'2× sebulan', BULANAN:'1× sebulan' };
const S = { data:null, tab: new Date().getHours() < 12 ? 'PAGI' : 'PETANG', ic:'', pending:null, saving:false, rep:null, y:new Date().getFullYear(), m:new Date().getMonth()+1 };

async function api(body){
  const res = await fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ token }, body)) });
  return res.json();
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(m, err){ const t = $('toast'); t.textContent = m; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(toast._t); toast._t = setTimeout(() => t.className = 'toast', 3200); }
function fail(r){ if(r && /expired/i.test(r.error || '')) location.href = './login.html'; }

/* ---------- today ---------- */
async function load(){
  try{
    const r = await api({ action:'getBersihToday', ic:S.ic });
    if(!r.ok){ fail(r); $('list').innerHTML = '<div class="empty">' + esc(r.error || 'Ralat') + '</div>'; $('who').textContent = ''; return; }
    S.data = r;
    const sel = $('people');
    if(r.sup && r.people && r.people.length && !sel.options.length){
      sel.innerHTML = '<option value="">' + (r.staff && !S.ic ? 'Saya sendiri' : '— Pilih kakitangan —') + '</option>' + r.people.map(p => '<option value="' + esc(p.ic) + '">' + esc(p.name) + ' · ' + esc(p.unit) + '</option>').join('');
      sel.classList.remove('hide');
    }
    $('ro').classList.toggle('hide', !r.readOnly);
    if(!r.staff){ $('who').textContent = 'Penyelia'; $('list').innerHTML = '<div class="empty">Pilih kakitangan PPK / PRA di atas untuk melihat tugasan dan laporan mereka.</div>'; $('progTitle').textContent = '—'; $('progSub').textContent = ''; return; }
    $('who').textContent = r.staff.name + (r.staff.zone ? ' · ' + r.staff.zone : '');
    render();
  }catch(e){ $('list').innerHTML = '<div class="empty">Tiada sambungan. Cuba lagi.</div>'; }
}
function pickPerson(){ S.ic = $('people').value; S.rep = null; $('rep').innerHTML = ''; $('btnPrint').disabled = true; $('list').innerHTML = '<div class="empty"><div class="spin"></div>Memuatkan…</div>'; load(); }
function tab(t){ S.tab = t; render(); }
function render(){
  const d = S.data; if(!d || !d.staff) return;
  const pct = d.total ? Math.round(d.done / d.total * 100) : 0;
  $('ring').style.setProperty('--p', pct); $('ringTxt').textContent = pct + '%';
  $('progTitle').textContent = d.done + ' / ' + d.total + ' tugasan selesai';
  $('progSub').textContent = new Date().toLocaleDateString('ms-MY', { weekday:'long', day:'numeric', month:'long' });
  document.querySelectorAll('#tabSeg button').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
  const rows = d.tasks.filter(t => S.tab === 'ALL' || t.time === S.tab);
  $('list').innerHTML = rows.length ? rows.map(t =>
    '<div class="task' + (t.checkedIn ? ' done' : '') + '"><div class="chk" ' + (t.checkedIn || d.readOnly ? '' : 'onclick="openNote(' + t.taskId + ',\'' + t.time + '\')"') + '>✓</div>' +
    '<div class="tm"><div class="tn">' + esc(t.name) + '</div><div class="tf"><span class="fq ' + esc(t.freq.replace(/^2X/, 'X2')) + '">' + esc(FREQ[t.freq] || t.freq) + '</span>' + (S.tab === 'ALL' ? '<span>' + (t.time === 'PAGI' ? '☀️ Pagi' : '🌙 Petang') + '</span>' : '') + '</div>' +
    (t.checkedIn ? '<div class="ts">✓ ' + esc(t.timestamp) + '</div>' : '') + (t.note ? '<div class="nt">“' + esc(t.note) + '”</div>' : '') + '</div></div>').join('')
    : '<div class="empty">Tiada tugasan untuk sesi ini.</div>';
}
function openNote(id, time){
  const t = S.data.tasks.find(x => x.taskId === id && x.time === time); if(!t) return;
  S.pending = { id, time }; $('noteLbl').textContent = t.name + ' — ' + (time === 'PAGI' ? 'Pagi' : 'Petang'); $('noteIn').value = '';
  $('noteSheet').classList.add('show'); setTimeout(() => $('noteIn').focus(), 250);
}
function closeNote(){ $('noteSheet').classList.remove('show'); S.pending = null; }
async function confirmCheck(){
  if(!S.pending || S.saving) return; S.saving = true; $('noteOk').disabled = true;
  const p = S.pending, note = $('noteIn').value.trim();
  try{
    const r = await api({ action:'bersihCheck', taskId:p.id, time:p.time, note });
    if(r.ok){ toast('✅ Direkod ' + r.timestamp.slice(11, 16)); closeNote(); await load(); }
    else { fail(r); toast(r.error || 'Gagal menyimpan', true); if(/Sudah/.test(r.error || '')){ closeNote(); load(); } }
  }catch(e){ toast('Tiada sambungan — cuba lagi', true); }
  S.saving = false; $('noteOk').disabled = false;
}

/* ---------- report ---------- */
function view(v){
  document.querySelectorAll('#mainSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('vToday').classList.toggle('hide', v !== 'today'); $('vReport').classList.toggle('hide', v !== 'report');
  if(v === 'report'){ $('mLabel').textContent = MONTHS[S.m - 1] + ' ' + S.y; if(!S.rep) loadReport(); }
}
function chMonth(d){ S.m += d; if(S.m > 12){ S.m = 1; S.y++; } if(S.m < 1){ S.m = 12; S.y--; } S.rep = null; $('rep').innerHTML = ''; $('btnPrint').disabled = true; $('mLabel').textContent = MONTHS[S.m - 1] + ' ' + S.y; }
async function loadReport(){
  $('rep').innerHTML = '<div class="empty"><div class="spin"></div>Menjana laporan…</div>';
  try{
    const r = await api({ action:'getBersihReport', year:S.y, month:S.m, ic:S.ic });
    if(!r.ok){ fail(r); $('rep').innerHTML = '<div class="empty">' + esc(r.error || 'Ralat') + '</div>'; return; }
    S.rep = r; $('rep').innerHTML = '<div class="rwrap">' + table(r) + '</div>'; $('btnPrint').disabled = false;
    $('btnSet').classList.toggle('hide', !r.canEditSettings);
  }catch(e){ $('rep').innerHTML = '<div class="empty">Tiada sambungan. Cuba lagi.</div>'; }
}
function table(r){
  let h1 = '<th class="tc" rowspan="2">Tugasan</th>', h2 = '';
  for(let i = 1; i <= r.days; i++){ h1 += '<th colspan="2">' + i + '</th>'; h2 += '<th class="sc">P</th><th class="sc">T</th>'; }
  const body = r.tasks.map(tk => {
    let c = '';
    for(let d = 1; d <= r.days; d++) ['PAGI', 'PETANG'].forEach(tm => {
      c += tk.times.indexOf(tm) === -1 ? '<td class="na"></td>' : (r.lookup[tk.id + '|' + tm + '|' + d] ? '<td class="c">✓</td>' : '<td></td>');
    });
    return '<tr><td class="tc">' + esc(tk.name) + '</td>' + c + '</tr>';
  }).join('');
  return '<table class="rt"><thead><tr>' + h1 + '</tr><tr>' + h2 + '</tr></thead><tbody>' + body + '</tbody></table>';
}
function printReport(){
  const r = S.rep; if(!r) return; const s = r.settings || {};
  const w = window.open('', '_blank'); if(!w){ toast('Benarkan pop-up untuk mencetak', true); return; }
  w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Laporan Kebersihan</title><style>body{font-family:Arial,sans-serif;padding:10mm;margin:0}table{width:100%;border-collapse:collapse;font-size:7px}th,td{border:1px solid #9bb;padding:3px 2px;text-align:center;white-space:nowrap}.tc{text-align:left;white-space:normal;max-width:110px;background:#f0f7f6;font-size:7px;padding:3px 5px}.sc{background:#e6f2f0;color:#0B3D3A}thead th,thead .tc{background:#0B3D3A;color:#fff}.c{color:#0a8f5a;font-weight:800;font-size:9px}.na{background:#eee}.ft{display:flex;justify-content:space-between;margin-top:18px;gap:16px}.sg{flex:1;text-align:center;font-size:9px}.sg img{max-height:55px;max-width:150px;display:block;margin:6px auto}.ln{border-top:1px solid #333;margin-top:6px;padding-top:5px}@page{size:A4 landscape;margin:8mm}</style></head><body>' +
    '<div style="text-align:center;margin-bottom:10px"><div style="font-size:14px;font-weight:900">LAPORAN PENGURUSAN KEBERSIHAN</div><div style="font-size:11px;font-weight:700;margin-top:2px">' + esc(s.orgName || '') + '</div><div style="font-size:10px;margin-top:2px">' + MONTHS[r.month - 1] + ' ' + r.year + '</div><div style="font-size:10px;margin-top:6px"><b>Nama:</b> ' + esc(r.staffName) + (r.zone ? ' &nbsp; <b>Zon:</b> ' + esc(r.zone) : '') + '</div></div>' +
    table(r) +
    '<div class="ft"><div class="sg">Tandatangan penyelia:' + (s.sig ? '<img src="' + esc(s.sig) + '">' : '<div style="height:55px"></div>') + '<div class="ln">' + esc(s.superName || '') + '</div></div><div class="sg">Cop rasmi:' + (s.stamp ? '<img src="' + esc(s.stamp) + '">' : '<div style="height:55px"></div>') + '</div></div>' +
    '<p style="font-size:8px;color:#777;text-align:center;margin-top:10px">Dijana: ' + esc(r.generated) + ' · SIAGA BERSIH</p></body></html>');
  w.document.close(); setTimeout(() => w.print(), 700);
}
function openSet(){ const s = (S.rep && S.rep.settings) || {}; $('sOrg').value = s.orgName || ''; $('sSup').value = s.superName || ''; $('sSig').value = s.sig || ''; $('sStamp').value = s.stamp || ''; $('setSheet').classList.add('show'); }
async function saveSet(){
  $('sSave').disabled = true;
  try{
    const r = await api({ action:'saveBersihSettings', orgName:$('sOrg').value, superName:$('sSup').value, sig:$('sSig').value, stamp:$('sStamp').value });
    if(r.ok){ toast('✅ Tetapan disimpan'); $('setSheet').classList.remove('show'); loadReport(); } else toast(r.error || 'Gagal', true);
  }catch(e){ toast('Tiada sambungan', true); }
  $('sSave').disabled = false;
}
document.querySelectorAll('.sheet').forEach(b => b.addEventListener('click', e => { if(e.target === b) b.classList.remove('show'); }));
load();
</script>
</body>
</html>
