<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F4530">
<title>NHSI — Analisis Saringan</title>
<link rel="icon" type="image/png" href="./siaga-192.png">
<style>
  :root{ --bg:#EEF3F1; --card:#fff; --ink:#16231F; --mut:#5E7069; --line:#D6E0DB; --acc:#1A6B4A; --acc2:#0F4530; --accl:#E3F0EB; --dg:#C0392B; --dgl:#FBEAE7; --warn:#B45309; --warnl:#FEF3E2; --ok:#1f9a57; --blue:#2F7FD3; --amber:#E0A100; --track:#EAF0ED;  --onacc:#0F4530; }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#0E1A17; --card:#15251F; --ink:#E7F1ED; --mut:#97ADA5; --line:#27403A; --accl:#17352B; --onacc:#A8EBCB; --dg:#FF9A8D; --warn:#F0B35A; --dgl:#3a1d19; --warnl:#3a2c14; --track:#1d332c; } }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; }
  body{ background:var(--bg); color:var(--ink); font-family:Inter,'Segoe UI',system-ui,sans-serif; min-height:100vh; padding-bottom:60px; }
  .top{ position:sticky; top:0; z-index:30; background:linear-gradient(135deg,var(--acc2),var(--acc)); color:#fff; box-shadow:0 6px 18px -10px rgba(0,0,0,.5); padding:calc(10px + env(safe-area-inset-top)) 14px 10px; }
  .top .r{ display:flex; align-items:center; gap:10px; max-width:1100px; margin:0 auto; }
  .ib{ width:42px; height:42px; border:none; border-radius:13px; background:rgba(255,255,255,.16); color:#fff; font-size:19px; cursor:pointer; flex:none; }
  .ttl{ flex:1; font-weight:800; font-size:17px; line-height:1.15; } .ttl small{ display:block; font-weight:500; font-size:11.5px; opacity:.85; }
  .wrap{ max-width:1100px; margin:0 auto; padding:14px; }
  /* filter panel */
  .fp{ background:var(--card); border:1px solid var(--line); border-radius:20px; padding:12px; margin-bottom:14px; box-shadow:0 8px 22px -18px rgba(0,0,0,.4); }
  .seg{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; background:var(--track); padding:4px; border-radius:14px; }
  .seg button{ height:42px; border:none; border-radius:11px; background:transparent; color:var(--ink); font:800 13.5px Inter,sans-serif; cursor:pointer; transition:all .2s; }
  .seg button.on{ background:var(--card); color:var(--onacc); box-shadow:0 3px 10px -4px rgba(0,0,0,.35); }
  .rng{ display:none; grid-template-columns:1fr 1fr auto; gap:8px; margin-top:10px; align-items:end; } .rng.on{ display:grid; animation:rise .25s; }
  .rng label{ font-size:11px; font-weight:800; color:var(--mut); text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:3px; }
  .rng input{ width:100%; height:44px; border-radius:12px; border:1.5px solid var(--line); background:var(--card); color:var(--ink); font:600 15px Inter,sans-serif; padding:0 10px; }
  .go{ height:44px; padding:0 18px; border:none; border-radius:12px; background:var(--acc); color:#fff; font:800 14px Inter,sans-serif; cursor:pointer; }
  .tg{ width:100%; margin-top:10px; height:44px; border-radius:12px; border:1.5px dashed var(--line); background:transparent; color:var(--onacc); font:800 13.5px Inter,sans-serif; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  .tg b{ background:var(--acc); color:#fff; border-radius:99px; padding:1px 8px; font-size:12px; } .tg b:empty{ display:none; }
  .fx{ display:none; margin-top:12px; } .fx.on{ display:block; animation:rise .25s; }
  .fx h4{ margin:12px 0 6px; font-size:11px; font-weight:800; color:var(--mut); text-transform:uppercase; letter-spacing:.07em; display:flex; justify-content:space-between; align-items:center; }
  .chips{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip{ border:1.5px solid var(--line); background:var(--card); color:var(--ink); border-radius:99px; padding:8px 13px; font:700 13px Inter,sans-serif; cursor:pointer; transition:all .15s; }
  .chip:active{ transform:scale(.96); } .chip.on{ background:var(--accl); border-color:var(--acc); color:var(--onacc); box-shadow:0 0 0 3px rgba(26,107,74,.12); } .chip.bad.on{ background:var(--dgl); border-color:var(--dg); color:var(--dg); box-shadow:0 0 0 3px rgba(192,57,43,.12); }
  .mini{ border:none; background:none; color:var(--acc); font:800 12px Inter,sans-serif; cursor:pointer; text-decoration:underline; }
  .mode{ display:inline-flex; background:var(--track); border-radius:10px; padding:2px; } .mode button{ border:none; background:transparent; font:800 11.5px Inter,sans-serif; padding:5px 10px; border-radius:8px; color:var(--mut); cursor:pointer; } .mode button.on{ background:var(--card); color:var(--onacc); }
  .act{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px; align-items:center; } .act .sp{ flex:1; }
  .tag{ display:inline-flex; align-items:center; gap:6px; background:var(--accl); color:var(--onacc); border-radius:99px; padding:5px 6px 5px 11px; font:800 12px Inter,sans-serif; } .tag button{ border:none; background:rgba(0,0,0,.12); color:inherit; width:20px; height:20px; border-radius:50%; cursor:pointer; font-size:11px; line-height:1; }
  .btn{ height:40px; padding:0 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--card); color:var(--ink); font:800 13px Inter,sans-serif; cursor:pointer; }
  .per{ color:var(--mut); font-size:13px; font-weight:600; margin:0 0 10px; } .per b{ color:var(--ink); }
  /* KPI */
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .kpi{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px; position:relative; overflow:hidden; }
  .kpi::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--c,var(--acc)); }
  .kpi small{ display:block; font-size:11px; font-weight:800; color:var(--mut); text-transform:uppercase; letter-spacing:.05em; } .kpi b{ display:block; font-size:32px; line-height:1.15; font-variant-numeric:tabular-nums; margin-top:2px; } .kpi span{ font-size:12px; color:var(--mut); font-weight:600; }
  /* cards / charts */
  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:14px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:20px; padding:16px; box-shadow:0 8px 22px -18px rgba(0,0,0,.4); }
  .card.wide{ grid-column:1/-1; }
  .card h3{ margin:0 0 2px; font-size:15px; } .card .sub{ margin:0 0 12px; font-size:12px; color:var(--mut); }
  .hb{ display:grid; grid-template-columns:minmax(90px,34%) 1fr auto; gap:10px; align-items:center; padding:6px 4px; border-radius:10px; cursor:pointer; }
  .hb:hover{ background:var(--accl); } .hb.sel{ background:var(--accl); outline:2px solid var(--acc); }
  .hb .l{ font-size:13px; font-weight:700; line-height:1.2; } .hb .t{ height:14px; border-radius:99px; background:var(--track); overflow:hidden; } .hb .n{ font-size:13px; font-weight:800; font-variant-numeric:tabular-nums; min-width:62px; text-align:right; } .hb .n small{ color:var(--mut); font-weight:600; }
  .bar{ display:block; height:100%; border-radius:99px; background:var(--c,var(--acc)); transform:scaleX(0); transform-origin:left; transition:transform .9s cubic-bezier(.2,.8,.2,1); transition-delay:calc(var(--i,0) * 70ms); }
  .vb{ display:flex; align-items:flex-end; gap:8px; height:190px; padding-top:18px; }
  .vc{ flex:1; min-width:0; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; cursor:pointer; border-radius:10px; }
  .vc:hover{ background:var(--accl); } .vc.sel{ background:var(--accl); outline:2px solid var(--acc); }
  .vc .v{ font-size:12px; font-weight:800; margin-bottom:4px; font-variant-numeric:tabular-nums; opacity:0; transition:opacity .4s .6s; }
  .vc .col{ width:70%; max-width:46px; flex:1 1 0; display:flex; align-items:flex-end; } .vc .col i{ display:block; width:100%; height:var(--h); min-height:3px; border-radius:8px 8px 3px 3px; background:var(--c,var(--acc)); transform:scaleY(0); transform-origin:bottom; transition:transform .9s cubic-bezier(.2,.8,.2,1); transition-delay:calc(var(--i,0) * 70ms); }
  .vc .x{ font-size:11px; color:var(--mut); font-weight:700; margin-top:6px; text-align:center; line-height:1.1; height:26px; }
  .play .bar{ transform:scaleX(1); } .play .vc .col i{ transform:scaleY(1); } .play .vc .v{ opacity:1; }
  .donut{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; justify-content:center; }
  .donut svg{ width:150px; height:150px; transform:rotate(-90deg); } .donut circle{ fill:none; stroke-width:20; transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1); }
  .lg div{ display:flex; align-items:center; gap:8px; margin:6px 0; font-size:13px; font-weight:700; cursor:pointer; } .lg i{ width:12px; height:12px; border-radius:4px; background:var(--c); } .lg small{ color:var(--mut); font-weight:600; }
  .none{ color:var(--mut); font-size:13px; padding:18px 4px; text-align:center; }
  /* table */
  .tw{ overflow:auto; border:1px solid var(--line); border-radius:14px; } table{ border-collapse:collapse; width:100%; font-size:13px; min-width:1500px; } th{ text-align:left; background:var(--track); padding:9px 10px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--mut); position:sticky; top:0; } td{ padding:8px 10px; border-top:1px solid var(--line); white-space:nowrap; }
  .pill{ display:inline-block; padding:2px 8px; border-radius:99px; font-size:11.5px; font-weight:800; } .pill.l0{ background:var(--accl); color:var(--onacc); } .pill.l1{ background:var(--warnl); color:var(--warn); } .pill.l2,.pill.l3{ background:var(--dgl); color:var(--dg); }
  .sk{ background:linear-gradient(90deg,var(--track) 25%,var(--line) 50%,var(--track) 75%); background-size:200% 100%; animation:sh 1.2s infinite; border-radius:14px; height:110px; } @keyframes sh{ to{ background-position:-200% 0; } }
  .toast{ position:fixed; left:50%; bottom:24px; transform:translate(-50%,30px); opacity:0; z-index:70; background:#16231F; color:#fff; padding:12px 18px; border-radius:99px; font-weight:700; font-size:14px; transition:all .25s; pointer-events:none; max-width:90vw; } .toast.on{ transform:translate(-50%,0); opacity:1; }
  @keyframes rise{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  @media (max-width:520px){ .grid{ grid-template-columns:1fr; } .hb{ grid-template-columns:minmax(80px,38%) 1fr auto; } }
  @media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important; } .bar{ transform:scaleX(1); } .vc .col i{ transform:scaleY(1); } .vc .v{ opacity:1; } }
  .mono{ font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace; letter-spacing:.02em; }
  .eye{ width:38px; height:34px; border-radius:10px; border:1.5px solid var(--line); background:var(--card); font-size:17px; cursor:pointer; } .eye:hover,.eye:focus-visible{ border-color:var(--acc); background:var(--accl); outline:none; } .eye:disabled{ opacity:.5; }
  .pdfov{ position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; padding:12px; } .pdfov.on{ display:flex; }
  .pdfbox{ background:var(--card); color:var(--ink); border-radius:20px; width:min(860px,100%); height:min(92vh,1000px); display:flex; flex-direction:column; overflow:hidden; box-shadow:0 30px 80px -20px rgba(0,0,0,.6); }
  .pdfbar{ display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line); } .pdfbar b{ flex:1; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pdfbar button{ height:40px; padding:0 12px; border-radius:12px; border:1.5px solid var(--line); background:var(--card); color:var(--ink); font:800 13px Inter,sans-serif; cursor:pointer; } .pdfbar .x{ width:40px; padding:0; font-size:18px; }
  .pdfbox iframe{ flex:1; border:0; width:100%; background:#fff; } .pdfld{ position:absolute; left:0; right:0; top:50%; text-align:center; color:#fff; font-weight:700; }
  @media print{ .pdfov{ display:none!important; } .top,.fp,.act,.toast,.tw ~ *{ display:none!important; } body{ background:#fff; } .card,.kpi{ break-inside:avoid; box-shadow:none; } .bar{ transform:scaleX(1)!important; } .vc .col i{ transform:scaleY(1)!important; } .vc .v{ opacity:1!important; } }
</style>
</head>
<body>
<div class="top"><div class="r">
  <button class="ib" onclick="goBack()" aria-label="Kembali">←</button>
  <div class="ttl">Analisis Saringan NHSI<small id="sub">Klinik Kesihatan Ayer Hitam</small></div>
  <button class="ib" onclick="load(true)" aria-label="Muat semula" id="rf">⟳</button>
</div></div>

<div class="wrap">
  <div class="fp">
    <div class="seg" id="seg" role="tablist"><button class="on" data-p="today" onclick="setPeriod('today')">Hari ini</button><button data-p="month" onclick="setPeriod('month')">Bulan ini</button><button data-p="range" onclick="setPeriod('range')">Pilih tarikh</button></div>
    <div class="rng" id="rng"><div><label for="dFrom">Dari</label><input type="date" id="dFrom"></div><div><label for="dTo">Hingga</label><input type="date" id="dTo"></div><button class="go" onclick="applyRange()">Papar</button></div>
    <button class="tg" id="tg" onclick="toggleFx()">⚙ Penapis <b id="fc"></b></button>
    <div class="fx" id="fx">
      <h4>Jantina</h4><div class="chips" id="fGender"></div>
      <h4>Umur <button class="mini" onclick="clearSet('ages')">kosongkan</button></h4><div class="chips" id="fAge"></div>
      <h4>Keputusan <span><span class="mode" id="fMode"><button data-m="AND" class="on" onclick="setMode('AND')">Semua</button><button data-m="OR" onclick="setMode('OR')">Mana-mana</button></span> <button class="mini" onclick="clearSet('res')">kosongkan</button></span></h4><div class="chips" id="fRes"></div>
      <div style="margin-top:12px"><button class="mini" onclick="clearAll()">↺ Set semula semua penapis</button></div>
    </div>
  </div>

  <div class="per" id="per"></div>
  <div class="act" id="act"></div>
  <div class="kpis" id="kpis"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  <div class="grid" id="charts"></div>

  <div class="card wide" style="margin-top:14px">
    <h3>Senarai klien <span id="tcount" style="color:var(--mut);font-weight:600"></span></h3><p class="sub">Mengikut penapis semasa · mengandungi data peribadi — jangan kongsi di luar</p>
    <div class="act"><button class="btn" onclick="exportCsv()">⬇ CSV</button><button class="btn" onclick="window.print()">🖨 Cetak</button></div>
    <div class="tw"><table><thead><tr><th>Tarikh</th><th>No. IC</th><th>Nama</th><th>Telefon</th><th>Umur</th><th>Jantina</th><th>BMI</th><th>TD</th><th>Nadi</th><th>Glukosa</th><th>Kolesterol</th><th>CVD 10 thn</th><th>Merokok</th><th>Whooley</th><th>Rujukan</th><th>Susulan</th><th>Status</th><th>Lihat</th></tr></thead><tbody id="tb"></tbody></table></div>
    <div style="text-align:center;margin-top:10px"><button class="btn" id="more" onclick="showMore()" style="display:none">Tunjuk lagi</button></div>
  </div>
</div>
<div class="pdfov" id="pdfov" onclick="if(event.target===this)closePdf()"><div class="pdfbox" role="dialog" aria-modal="true" aria-labelledby="pdfT">
  <div class="pdfbar"><b id="pdfT">Keputusan saringan</b><button onclick="printPdf()">🖨 Cetak / PDF</button><button onclick="openPdfTab()">↗ Tab baharu</button><button class="x" onclick="closePdf()" aria-label="Tutup">✕</button></div>
  <iframe id="pdfF" title="Keputusan saringan klien"></iframe></div></div>
<div class="toast" id="toast"></div>

<script src="./nhsi-risk.js?v=1"></script>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxOamlCtYPlZCvQOys1VTjkZu7aVqMsdDStTdytPex7eH5jNGuIBiR91BfougaEF3SI/exec';
const token = sessionStorage.getItem('kkah_session_token');
const $ = id => document.getElementById(id);
const VIA_QR = sessionStorage.getItem('kkah_via') === 'qr', DESKTOP = !/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
function toLogin(){ location.replace((VIA_QR || DESKTOP) ? './qr-login.html?next=nhsi.html' : './login.html'); }
if (!token) toLogin();
function goBack(){ location.href = './nhsi.html'; }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); }
function api(body, ms){ const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms || 40000); return fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ token }, body)), signal: ctl.signal }).then(r => r.json()).finally(() => clearTimeout(t)); }
const pad = n => String(n).padStart(2, '0'), ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fmtD = s => { const [y, m, d] = s.split('-'); return d + '/' + m + '/' + y; };

/* ---------- state ---------- */
let CFG = { bp_sys_high:140, bp_dia_high:90, bp_sys_urgent:180, bp_dia_urgent:110, pulse_low:60, pulse_high:100, fbs_ifg:6.1, fbs_high:7, rbs_border:7.8, rbs_high:11.1, chol_border:5.2, chol_high:6.2 };
const S = { period:'today', from:ymd(new Date()), to:ymd(new Date()), gender:'', ages:new Set(), res:new Set(), mode:'AND' };
let ALL = [], truncated = false, shown = 60, view = [], busy = false;
const AGES = [['<18', 0, 17], ['18–29', 18, 29], ['30–39', 30, 39], ['40–49', 40, 49], ['50–59', 50, 59], ['60–69', 60, 69], ['70+', 70, 200]];
const RES = [['cvdHigh', 'Risiko CVD tinggi', 1], ['cvdMid', 'Risiko CVD sederhana', 0], ['bpHigh', 'TD tinggi', 1], ['bpUrgent', 'TD segera', 1], ['gluHigh', 'Glukosa tinggi', 1], ['gluBorder', 'Glukosa sempadan', 0], ['cholHigh', 'Kolesterol tinggi', 1], ['cholBorder', 'Kolesterol sempadan', 0],
  ['bmiObese', 'Obes', 1], ['bmiOver', 'Berat berlebihan', 0], ['bmiUnder', 'Kurang berat', 0], ['smoker', 'Perokok / vape', 1], ['whooley', 'Whooley +', 1], ['refer', 'Ada rujukan', 0], ['allNormal', 'Semua normal', 0], ['s3pending', 'Belum konsultasi', 0]];

/* ---------- classification ---------- */
function flagsOf(sbp, dbp, pul, glu, gt, chol){
  const c = CFG, f = {};
  f.bp = (sbp >= c.bp_sys_urgent || dbp >= c.bp_dia_urgent) ? 3 : (sbp >= c.bp_sys_high || dbp >= c.bp_dia_high) ? 2 : 0;
  f.pul = pul < c.pulse_low || pul > c.pulse_high ? 1 : 0;
  if (glu != null) f.glu = gt === 'Puasa' ? (glu >= c.fbs_high ? 2 : glu >= c.fbs_ifg ? 1 : 0) : (glu >= c.rbs_high ? 2 : glu >= c.rbs_border ? 1 : 0);
  if (chol != null) f.chol = chol >= c.chol_high ? 2 : chol >= c.chol_border ? 1 : 0;
  return f;
}
const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
function enrich(r){
  r.bmiN = num(r.bmi); r.bmiLv = r.s1 ? ({ 'Kurang berat badan':1, 'Normal':0, 'Berat badan berlebihan':1, 'Obes':2 }[r.bc] ?? null) : null;
  if (r.s2){ const f = flagsOf(num(r.sb), num(r.db), num(r.pu), num(r.gl), r.gt, num(r.ch)); r.bp = f.bp; r.glu = f.glu; r.chol = f.chol; r.pul = f.pul; } else { r.bp = r.glu = r.chol = r.pul = null; }
  let m = 0; [r.bp, r.glu, r.chol, r.bmiLv].forEach(x => { if (x != null) m = Math.max(m, x); }); if (r.w) m = Math.max(m, 2); r.lv = m;
  r.smk = r.sm === 'Perokok' || /Vape/.test(r.sm); r.k = {};
  r.cvd = null; if (r.s1 && r.s2){ const q = NHSI_RISK.cvdRisk({ age: r.a, gender: r.g === 'L' ? 'Lelaki' : 'Perempuan', bmi: r.bmi, sbp: r.sb, treated: /Darah tinggi/.test(r.h || ''), smoker: r.sm === 'Perokok' && r.st !== 'Vape', diabetes: /Kencing manis/.test(r.h || '') || r.glu === 2 }); if (q.ok) r.cvd = q; }
  r.k.cvdHigh = !!(r.cvd && r.cvd.level === 2); r.k.cvdMid = !!(r.cvd && r.cvd.level === 1);
  if (r.k.cvdHigh) r.lv = Math.max(r.lv, 2);
  r.k.bpHigh = r.bp === 2; r.k.bpUrgent = r.bp === 3; r.k.bpNormal = r.bp === 0;
  r.k.gluHigh = r.glu === 2; r.k.gluBorder = r.glu === 1; r.k.gluNormal = r.glu === 0;
  r.k.cholHigh = r.chol === 2; r.k.cholBorder = r.chol === 1; r.k.cholNormal = r.chol === 0;
  r.k.bmiObese = r.bc === 'Obes'; r.k.bmiOver = r.bc === 'Berat badan berlebihan'; r.k.bmiUnder = r.bc === 'Kurang berat badan'; r.k.bmiNormal = r.bc === 'Normal';
  r.k.smoker = r.smk; r.k.whooley = r.w; r.k.refer = (r.rf || []).length > 0; r.k.allNormal = r.s2 && r.lv === 0; r.k.s3pending = !r.s3;
  return r;
}
function passes(r){
  if (S.gender && r.g !== S.gender) return false;
  if (S.ages.size && ![...S.ages].some(i => r.a >= AGES[i][1] && r.a <= AGES[i][2])) return false;
  if (S.res.size){ const ks = [...S.res]; return S.mode === 'AND' ? ks.every(k => r.k[k]) : ks.some(k => r.k[k]); }
  return true;
}

/* ---------- data ---------- */
async function load(manual){
  if (busy) return; busy = true; $('rf').style.opacity = .5;
  let r; try { r = await api({ action:'nhsiCall', fn:'report', args:{ from:S.from, to:S.to } }); } catch(e){ r = { ok:false, error:'Tiada sambungan.' }; }
  busy = false; $('rf').style.opacity = 1;
  if (!r || !r.ok){ if (r && (/expired/i.test(r.error || '') || r.code === 'QR_EXPIRED')) { toLogin(); return; } toast((r && r.error) || 'Gagal memuat.'); if (!ALL.length) draw(); return; }
  if (r.cfg) CFG = Object.assign(CFG, r.cfg); ALL = r.rows.map(enrich); truncated = !!r.truncated; draw();
  if (manual) toast('Dikemas kini');
}
function setPeriod(p){
  S.period = p; const t = new Date();
  [...$('seg').children].forEach(b => b.classList.toggle('on', b.dataset.p === p)); $('rng').classList.toggle('on', p === 'range');
  if (p === 'today'){ S.from = S.to = ymd(t); load(); }
  else if (p === 'month'){ S.from = t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-01'; S.to = ymd(t); load(); }
  else { $('dFrom').value = S.from; $('dTo').value = S.to; $('dFrom').max = $('dTo').max = ymd(t); }
}
function applyRange(){
  const a = $('dFrom').value, b = $('dTo').value; if (!a || !b) return toast('Sila pilih kedua-dua tarikh.');
  let f = a, t = b; if (f > t){ f = b; t = a; }
  if ((new Date(t) - new Date(f)) / 86400000 > 366) return toast('Julat maksimum 366 hari.');
  S.from = f; S.to = t; load();
}

/* ---------- filters ui ---------- */
function toggleFx(){ $('fx').classList.toggle('on'); }
function drawFilters(){
  $('fGender').innerHTML = [['', 'Semua'], ['L', 'Lelaki'], ['P', 'Perempuan']].map(g => '<button class="chip' + (S.gender === g[0] ? ' on' : '') + '" onclick="setGender(\'' + g[0] + '\')">' + g[1] + '</button>').join('');
  $('fAge').innerHTML = AGES.map((a, i) => '<button class="chip' + (S.ages.has(i) ? ' on' : '') + '" onclick="togSet(\'ages\',' + i + ')">' + a[0] + '</button>').join('');
  $('fRes').innerHTML = RES.map(r => '<button class="chip' + (r[2] ? ' bad' : '') + (S.res.has(r[0]) ? ' on' : '') + '" onclick="togSet(\'res\',\'' + r[0] + '\')">' + r[1] + '</button>').join('');
  [...$('fMode').children].forEach(b => b.classList.toggle('on', b.dataset.m === S.mode));
  const n = (S.gender ? 1 : 0) + S.ages.size + S.res.size; $('fc').textContent = n ? n : '';
  const tags = []; if (S.gender) tags.push(['gender', '', S.gender === 'L' ? 'Lelaki' : 'Perempuan']); S.ages.forEach(i => tags.push(['ages', i, 'Umur ' + AGES[i][0]])); S.res.forEach(k => tags.push(['res', k, RES.filter(r => r[0] === k)[0]?.[1] || k]));
  $('act').innerHTML = tags.map(t => '<span class="tag">' + esc(t[2]) + '<button aria-label="Buang" onclick="' + (t[0] === 'gender' ? "setGender('')" : "togSet('" + t[0] + "'," + (typeof t[1] === 'number' ? t[1] : "'" + t[1] + "'") + ')') + '">✕</button></span>').join('') + (tags.length ? '<button class="mini" onclick="clearAll()">Set semula</button>' : '');
}
function setGender(g){ S.gender = g; draw(); }
function togSet(k, v){ const s = S[k]; s.has(v) ? s.delete(v) : s.add(v); draw(); }
function clearSet(k){ S[k].clear(); draw(); }
function setMode(m){ S.mode = m; draw(); }
function clearAll(){ S.gender = ''; S.ages.clear(); S.res.clear(); draw(); }

/* ---------- charts ---------- */
const cnt = (arr, fn) => arr.filter(fn).length;
const pct = (n, d) => d ? Math.round(n / d * 100) + '%' : '–';
let uid = 0;
function hbars(title, sub, items, den){
  const max = Math.max(1, ...items.map(i => i.n)), id = 'c' + (uid++);
  const body = items.every(i => !i.n) ? '<div class="none">Tiada data</div>' : items.map((i, k) => '<div class="hb' + (i.key && (i.key[0] === 'age' ? S.ages.has(i.key[1]) : S.res.has(i.key[1])) ? ' sel' : '') + '" ' + (i.key ? 'onclick="' + (i.key[0] === 'age' ? 'togSet(\'ages\',' + i.key[1] + ')' : "togSet('res','" + i.key[1] + "')") + '"' : '') + '><div class="l">' + esc(i.l) + '</div><div class="t"><span class="bar" style="--c:' + i.c + ';--i:' + k + ';width:' + Math.max(i.n ? 3 : 0, i.n / max * 100) + '%"></span></div><div class="n">' + i.n + ' <small>' + pct(i.n, den) + '</small></div></div>').join('');
  return '<div class="card"><h3>' + title + '</h3><p class="sub">' + sub + '</p>' + body + '</div>';
}
function vbars(title, sub, items, wide){
  const max = Math.max(1, ...items.map(i => i.n));
  const body = items.every(i => !i.n) ? '<div class="none">Tiada data</div>' : '<div class="vb">' + items.map((i, k) => '<div class="vc' + (i.key && S.ages.has(i.key[1]) ? ' sel' : '') + '" ' + (i.key ? 'onclick="togSet(\'ages\',' + i.key[1] + ')"' : '') + '><div class="v">' + i.n + '</div><div class="col"><i style="--c:' + i.c + ';--i:' + k + ';--h:' + (i.n / max * 100) + '%"></i></div><div class="x">' + esc(i.l) + '</div></div>').join('') + '</div>';
  return '<div class="card' + (wide ? ' wide' : '') + '"><h3>' + title + '</h3><p class="sub">' + sub + '</p>' + body + '</div>';
}
function donut(title, sub, items){
  const tot = items.reduce((a, b) => a + b.n, 0), R = 60, C = 2 * Math.PI * R; let off = 0;
  const arcs = items.map(i => { const len = tot ? i.n / tot * C : 0, el = '<circle cx="75" cy="75" r="' + R + '" stroke="' + i.c + '" stroke-dasharray="0 ' + C + '" data-len="' + len + '" data-c="' + C + '" stroke-dashoffset="' + (-off) + '"/>'; off += len; return el; }).join('');
  const body = tot ? '<div class="donut"><svg viewBox="0 0 150 150" aria-hidden="true"><circle cx="75" cy="75" r="' + R + '" stroke="var(--track)"/>' + arcs + '</svg><div class="lg">' + items.map(i => '<div style="--c:' + i.c + '" onclick="' + i.click + '"><i></i>' + esc(i.l) + ' <b>' + i.n + '</b> <small>' + pct(i.n, tot) + '</small></div>').join('') + '</div></div>' : '<div class="none">Tiada data</div>';
  return '<div class="card"><h3>' + title + '</h3><p class="sub">' + sub + '</p>' + body + '</div>';
}
function drawCharts(v){
  const M2 = v.filter(r => r.s2), M1 = v.filter(r => r.s1), card = [];
  card.push(hbars('Aliran stesen', 'Berapa klien sampai setiap stesen', [
    { l:'Didaftar', n:v.length, c:'#1A6B4A' }, { l:'Stesen A · tinggi/berat', n:cnt(v, r => r.s1), c:'#2F7FD3' }, { l:'Stesen B · TD/gula/kol.', n:cnt(v, r => r.s2), c:'#E0A100' }, { l:'Stesen C · konsultasi', n:cnt(v, r => r.s3), c:'#1f9a57' }], v.length));
  card.push(vbars('Kumpulan umur', 'Tekan lajur untuk menapis', AGES.map((a, i) => ({ l:a[0], n:cnt(v, r => r.a >= a[1] && r.a <= a[2]), c:'#1A6B4A', key:['age', i] }))));
  const L = cnt(v, r => r.g === 'L'), P = v.length - L;
  card.push(donut('Jantina', 'Tekan untuk menapis', [{ l:'Lelaki', n:L, c:'#2F7FD3', click:"setGender('L')" }, { l:'Perempuan', n:P, c:'#D6578B', click:"setGender('P')" }]));
  card.push(hbars('Indeks jisim badan (BMI Asia)', M1.length + ' klien diukur', [
    { l:'Kurang berat badan', n:cnt(M1, r => r.k.bmiUnder), c:'#2F7FD3', key:['res', 'bmiUnder'] }, { l:'Normal', n:cnt(M1, r => r.k.bmiNormal), c:'#1f9a57' }, { l:'Berat berlebihan', n:cnt(M1, r => r.k.bmiOver), c:'#E0A100', key:['res', 'bmiOver'] }, { l:'Obes', n:cnt(M1, r => r.k.bmiObese), c:'#C0392B', key:['res', 'bmiObese'] }], M1.length));
  card.push(hbars('Tekanan darah', M2.length + ' klien diukur', [
    { l:'Normal', n:cnt(M2, r => r.bp === 0), c:'#1f9a57' }, { l:'Tinggi', n:cnt(M2, r => r.bp === 2), c:'#E0A100', key:['res', 'bpHigh'] }, { l:'Sangat tinggi (segera)', n:cnt(M2, r => r.bp === 3), c:'#C0392B', key:['res', 'bpUrgent'] }], M2.length));
  const G = M2.filter(r => r.glu != null);
  card.push(hbars('Glukosa', G.length + ' klien diambil (puasa ' + cnt(G, r => r.gt === 'Puasa') + ' · rawak ' + cnt(G, r => r.gt !== 'Puasa') + ')', [
    { l:'Normal', n:cnt(G, r => r.glu === 0), c:'#1f9a57' }, { l:'Sempadan / IFG', n:cnt(G, r => r.glu === 1), c:'#E0A100', key:['res', 'gluBorder'] }, { l:'Tinggi (julat diabetes)', n:cnt(G, r => r.glu === 2), c:'#C0392B', key:['res', 'gluHigh'] }], G.length));
  const K = M2.filter(r => r.chol != null);
  card.push(hbars('Kolesterol jumlah', K.length + ' klien diambil', [
    { l:'Normal', n:cnt(K, r => r.chol === 0), c:'#1f9a57' }, { l:'Sempadan', n:cnt(K, r => r.chol === 1), c:'#E0A100', key:['res', 'cholBorder'] }, { l:'Tinggi', n:cnt(K, r => r.chol === 2), c:'#C0392B', key:['res', 'cholHigh'] }], K.length));
  const sm = x => cnt(v, r => r.sm === x);
  card.push(hbars('Status merokok', 'Semua klien berdaftar', [{ l:'Tidak pernah', n:sm('Tidak pernah'), c:'#1f9a57' }, { l:'Bekas perokok', n:sm('Bekas perokok'), c:'#E0A100' }, { l:'Perokok semasa', n:sm('Perokok') + sm('Vape / e-rokok'), c:'#C0392B', key:['res', 'smoker'] }], v.length));
  const CV = v.filter(r => r.cvd); card.push(hbars('Risiko kardiovaskular 10 tahun', CV.length + ' klien (umur 30–74, S1 & S2 lengkap) · Framingham BMI', [{ l:'Rendah (<10%)', n:cnt(CV, r => r.cvd.level === 0), c:'#1f9a57' }, { l:'Sederhana (10–20%)', n:cnt(CV, r => r.cvd.level === 1), c:'#E0A100', key:['res', 'cvdMid'] }, { l:'Tinggi (>20%)', n:cnt(CV, r => r.cvd.level === 2), c:'#C0392B', key:['res', 'cvdHigh'] }], CV.length));
  const SM = v.filter(r => r.sm === 'Perokok'); card.push(hbars('Jenis rokok (perokok semasa)', SM.length + ' perokok semasa', [{ l:'Rokok sahaja', n:cnt(SM, r => !r.st || r.st === 'Rokok'), c:'#C0392B' }, { l:'Vape sahaja', n:cnt(SM, r => r.st === 'Vape'), c:'#E0A100' }, { l:'Kedua-duanya', n:cnt(SM, r => r.st === 'Kedua-duanya'), c:'#8E1B10' }], SM.length));
  card.push(hbars('Kesihatan mental (Whooley)', 'Saringan 2 soalan', [{ l:'Negatif', n:cnt(v, r => !r.w), c:'#1f9a57' }, { l:'Positif', n:cnt(v, r => r.w), c:'#C0392B', key:['res', 'whooley'] }], v.length));
  const hc = {}; v.forEach(r => (r.h || '').split('; ').forEach(h => { if (h && h !== 'Tiada') hc[h] = (hc[h] || 0) + 1; }));
  const hl = Object.entries(hc).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([l, n]) => ({ l, n, c:'#2F7FD3' }));
  card.push(hbars('Sejarah penyakit dilapor', 'Disahkan sendiri oleh klien', hl.length ? hl : [{ l:'Tiada', n:0, c:'#2F7FD3' }], v.length));
  card.push(hbars('Tahap keseluruhan', 'Berdasarkan semua keputusan', [{ l:'Normal', n:cnt(v, r => r.s2 && r.lv === 0), c:'#1f9a57', key:['res', 'allNormal'] }, { l:'Sempadan', n:cnt(v, r => r.s2 && r.lv === 1), c:'#E0A100' }, { l:'Tinggi / perlu tindakan', n:cnt(v, r => r.lv >= 2), c:'#C0392B' }, { l:'Belum lengkap (tiada S2)', n:cnt(v, r => !r.s2), c:'#97ADA5' }], v.length));
  const rc = {}; v.forEach(r => (r.rf || []).forEach(x => rc[x] = (rc[x] || 0) + 1)); const rl = Object.entries(rc).sort((a, b) => b[1] - a[1]).map(([l, n]) => ({ l, n, c:'#1A6B4A' }));
  card.push(hbars('Rujukan oleh doktor', 'Klien yang sudah konsultasi', rl.length ? rl : [{ l:'Tiada', n:0, c:'#1A6B4A' }], cnt(v, r => r.s3)));
  // trend
  const days = {}; v.forEach(r => days[r.d] = (days[r.d] || 0) + 1); const keys = Object.keys(days).sort();
  if (S.from !== S.to){
    const span = (new Date(S.to) - new Date(S.from)) / 86400000 + 1, byMonth = span > 62, agg = {};
    keys.forEach(k => { const g = byMonth ? k.slice(0, 7) : k; agg[g] = (agg[g] || 0) + days[k]; });
    const ks = Object.keys(agg).sort(), tl = ks.map(k => ({ l: byMonth ? k.slice(5) + '/' + k.slice(2, 4) : k.slice(8) + '/' + k.slice(5, 7), n: agg[k], c:'#1A6B4A' }));
    card.push(vbars('Pendaftaran ' + (byMonth ? 'mengikut bulan' : 'mengikut hari'), 'Jumlah klien berdaftar', tl.length ? tl : [{ l:'-', n:0, c:'#1A6B4A' }], true));
  }
  $('charts').innerHTML = card.join('');
  $('charts').classList.remove('play'); void $('charts').offsetWidth;
  requestAnimationFrame(() => requestAnimationFrame(() => { $('charts').classList.add('play'); $('charts').querySelectorAll('.donut circle[data-len]').forEach(c => c.setAttribute('stroke-dasharray', c.dataset.len + ' ' + c.dataset.c)); }));
}
function countUp(el, to, dec){ const t0 = performance.now(), from = 0; (function f(t){ const k = Math.min(1, (t - t0) / 800), e = 1 - Math.pow(1 - k, 3); el.textContent = dec ? (from + (to - from) * e).toFixed(1) : Math.round(from + (to - from) * e); if (k < 1) requestAnimationFrame(f); else el.textContent = dec ? to.toFixed(1) : to; })(t0); }
function drawKpis(v){
  const n = v.length, att = cnt(v, r => r.lv >= 2), ages = v.map(r => r.a).filter(a => a > 0), avg = ages.length ? ages.reduce((a, b) => a + b, 0) / ages.length : 0;
  const k = [['Didaftar', n, '', '#1A6B4A'], ['Selesai konsultasi', cnt(v, r => r.s3), pct(cnt(v, r => r.s3), n) + ' daripada didaftar', '#1f9a57'], ['Perlu perhatian', att, 'keputusan tinggi / Whooley +', '#C0392B'], ['Purata umur', avg, 'tahun', '#2F7FD3', 1], ['Perempuan', cnt(v, r => r.g === 'P'), pct(cnt(v, r => r.g === 'P'), n), '#D6578B'], ['Perokok', cnt(v, r => r.smk), pct(cnt(v, r => r.smk), n), '#E0A100']];
  $('kpis').innerHTML = k.map((x, i) => '<div class="kpi" style="--c:' + x[3] + '"><small>' + x[0] + '</small><b id="kp' + i + '">0</b><span>' + (x[2] || '&nbsp;') + '</span></div>').join('');
  k.forEach((x, i) => countUp($('kp' + i), x[1], x[4]));
}
const lvPill = (lv, t) => lv == null ? '<span style="color:var(--mut)">—</span>' : '<span class="pill l' + lv + '">' + t + '</span>';
function drawTable(){
  const rows = view.slice(0, shown);
  const stat = r => r.s3 ? '<span class="pill l0">Selesai</span>' : r.s2 ? '<span class="pill l1">Tunggu doktor</span>' : r.s1 ? '<span class="pill l1">Tunggu S2</span>' : '<span class="pill l1">Tunggu S1</span>';
  const icTxt = r => r.i ? r.i.replace(/^(\d{6})(\d{2})(\d{4})$/, '$1-$2-$3') : (r.pp ? 'Pasport ' + r.pp : '—');
  $('tb').innerHTML = rows.length ? rows.map(r => '<tr><td>' + fmtD(r.d) + '</td><td class="mono">' + esc(icTxt(r)) + '</td><td><b>' + esc(r.n) + '</b></td><td>' + (r.p ? '<a href="tel:' + esc(r.p) + '" style="color:inherit">' + esc(r.p) + '</a>' : '—') + '</td><td>' + r.a + '</td><td>' + r.g + '</td><td>' + (r.s1 ? lvPill(r.bmiLv, esc(r.bmi)) : '—') + '</td><td>' + (r.s2 ? lvPill(r.bp, esc(r.sb) + '/' + esc(r.db)) : '—') + '</td><td>' + (r.s2 ? lvPill(r.pul, esc(r.pu)) : '—') + '</td><td>' + (r.glu != null ? lvPill(r.glu, esc(r.gl) + ' ' + (r.gt === 'Puasa' ? 'P' : 'R')) : '—') + '</td><td>' + (r.chol != null ? lvPill(r.chol, esc(r.ch)) : '—') + '</td><td>' + (r.cvd ? lvPill(r.cvd.level, r.cvd.pct + '%') : '—') + '</td><td>' + (r.smk ? '<span class="pill l2">Ya</span>' : r.sm ? 'Tidak' : '—') + '</td><td>' + (r.w ? '<span class="pill l2">Positif</span>' : 'Negatif') + '</td><td style="white-space:normal;min-width:130px">' + (esc((r.rf || []).join(', ')) || '—') + '</td><td>' + (esc(r.fu) || '—') + '</td><td>' + stat(r) + '</td><td>' + (r.s3 ? '<button class="eye" aria-label="Lihat keputusan ' + esc(r.n) + '" onclick="viewPdf(\'' + esc(r.id) + '\',this)">👁</button>' : '<span style="color:var(--mut)" title="Konsultasi belum selesai">—</span>') + '</td></tr>').join('') : '<tr><td colspan="18" class="none">Tiada klien sepadan.</td></tr>';
  $('more').style.display = view.length > shown ? 'inline-block' : 'none'; $('tcount').textContent = '(' + view.length + ')';
}
let pdfUrl = '';
async function viewPdf(id, btn){
  const r0 = ALL.filter(x => x.id === id)[0]; if (btn) btn.disabled = true;
  let r; try { r = await api({ action:'nhsiCall', fn:'resultLink', args:{ id } }, 25000); } catch(e){ r = { ok:false, error:'Tiada sambungan.' }; }
  if (btn) btn.disabled = false;
  if (!r || !r.ok){ if (r && (/expired/i.test(r.error || '') || r.code === 'QR_EXPIRED')) { toLogin(); return; } toast((r && r.error) || 'Gagal membuka keputusan.'); return; }
  pdfUrl = new URL('./nhsi-result.html?t=' + r.token, location.href).href;
  $('pdfT').textContent = r0 ? r0.n : 'Keputusan saringan'; $('pdfF').src = pdfUrl; $('pdfov').classList.add('on'); document.body.style.overflow = 'hidden';
}
function closePdf(){ $('pdfov').classList.remove('on'); $('pdfF').src = 'about:blank'; document.body.style.overflow = ''; }
function printPdf(){ try { $('pdfF').contentWindow.focus(); $('pdfF').contentWindow.print(); } catch(e){ openPdfTab(); } }
function openPdfTab(){ if (pdfUrl) window.open(pdfUrl + '&print=1', '_blank'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('pdfov').classList.contains('on')) closePdf(); });
function showMore(){ shown += 100; drawTable(); }
function draw(){
  drawFilters(); view = ALL.filter(passes); shown = 60;
  $('per').innerHTML = (S.from === S.to ? '<b>' + fmtD(S.from) + '</b>' : '<b>' + fmtD(S.from) + '</b> hingga <b>' + fmtD(S.to) + '</b>') + ' · ' + view.length + ' daripada ' + ALL.length + ' klien' + (truncated ? ' · <span style="color:var(--warn)">dipaparkan 20,000 terkini</span>' : '');
  $('sub').textContent = S.period === 'today' ? 'Hari ini' : S.period === 'month' ? 'Bulan ini' : 'Julat tarikh';
  if (!ALL.length){ $('kpis').innerHTML = ''; $('charts').innerHTML = '<div class="card wide none">Tiada klien berdaftar dalam tempoh ini.</div>'; $('tb').innerHTML = ''; $('more').style.display = 'none'; $('tcount').textContent = ''; return; }
  drawKpis(view); drawCharts(view); drawTable();
}
function exportCsv(){
  if (!view.length) return toast('Tiada data untuk dieksport.');
  const q = s => { s = String(s == null ? '' : s); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const head = ['Tarikh', 'No. IC / Pasport', 'Nama', 'Telefon', 'Umur', 'Jantina', 'BMI', 'Kategori BMI', 'Sistolik', 'Diastolik', 'Nadi', 'Glukosa', 'Jenis glukosa', 'Kolesterol', 'Merokok', 'Jenis rokok', 'Risiko CVD 10 thn (%)', 'Whooley positif', 'Rujukan', 'Susulan', 'Status'];
  const lines = [head.map(q).join(',')].concat(view.map(r => [r.d, r.i || r.pp, r.n, r.p, r.a, r.g === 'L' ? 'Lelaki' : 'Perempuan', r.bmi, r.bc, r.sb, r.db, r.pu, r.gl, r.gt, r.ch, r.sm, r.st || '', r.cvd ? r.cvd.pct : '', r.w ? 'Ya' : 'Tidak', (r.rf || []).join('; '), r.fu, r.s3 ? 'Selesai' : r.s2 ? 'Tunggu doktor' : r.s1 ? 'Tunggu S2' : 'Tunggu S1'].map(q).join(',')));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' })); a.download = 'NHSI_' + S.from + '_' + S.to + '.csv'; document.body.appendChild(a); a.click(); a.remove();
}
drawFilters(); load();
setInterval(() => { if (S.period === 'today' && !document.hidden) load(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.period === 'today') load(); });
