<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KKAH · Add Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-900:#0B3D3A; --teal-700:#0F5C56; --teal-500:#1C8F84;
    --mint-100:#EAF6F2; --mint-050:#F6FBF9;
    --gold-500:#C9A227; --green-500:#2FAE60; --red-500:#B3311A;
    --ink-700:#1E2B29; --ink-500:#5B6B68; --line:#DCEAE6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:radial-gradient(1200px 800px at 50% -10%, var(--mint-100), var(--mint-050));
    font-family:'Inter',sans-serif; color:var(--ink-700);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:440px; background:#fff; border-radius:28px;
    box-shadow:0 20px 60px -20px rgba(11,61,58,0.25);
    overflow:hidden; border:1px solid var(--line);
  }
  .head{
    padding:22px 28px 18px;
    background:linear-gradient(135deg, var(--teal-900), var(--teal-700));
    color:#fff; position:relative;
  }
  .head .eyebrow{ font-size:12px; letter-spacing:.08em; text-transform:uppercase; opacity:.75; font-weight:600; }
  .head h1{ font-family:'Manrope',sans-serif; font-size:20px; font-weight:800; margin:4px 0 0; }
  .gold-dot{ position:absolute; top:22px; right:26px; width:8px;height:8px;border-radius:50%; background:var(--gold-500); box-shadow:0 0 0 4px rgba(201,162,39,0.18); }
  .stage{ padding:28px; }

  .field{ margin-bottom:16px; }
  .field label{ font-size:12px; font-weight:600; color:var(--ink-500); display:block; margin-bottom:6px; }
  input[type=text]{
    width:100%; padding:12px 14px; border-radius:12px; font-size:14px;
    border:1px solid var(--line); font-family:'Inter',sans-serif; color:var(--ink-700);
  }
  input[type=text]:focus{ outline:none; border-color:var(--teal-500); box-shadow:0 0 0 3px rgba(28,143,132,0.15); }

  .photo-drop{
    border:2px dashed var(--line); border-radius:16px; padding:20px;
    text-align:center; cursor:pointer; transition:border-color .2s ease;
    position:relative; overflow:hidden;
  }
  .photo-drop:hover, .photo-drop.drag{ border-color:var(--teal-500); background:var(--mint-100); }
  .photo-drop input{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  .photo-drop .hint{ font-size:13px; color:var(--ink-500); }
  .viewfinder{
    position:relative; width:200px; height:200px; margin:0 auto 16px;
    border-radius:50%; display:flex; align-items:center; justify-content:center;
  }
  .viewfinder video, .viewfinder canvas{
    width:170px; height:170px; border-radius:50%; object-fit:cover; background:#0B3D3A;
  }
  .viewfinder canvas{ display:none; }
  .viewfinder.captured video{ display:none; }
  .viewfinder.captured canvas{ display:block; }
  .ring{ position:absolute; inset:0; border-radius:50%; border:3px solid var(--line); transition:border-color .4s ease; }
  .ring.ready{ border-color:var(--teal-500); }
  .ring.captured{ border-color:var(--green-500); box-shadow:0 0 0 8px rgba(47,174,96,0.15); }

  .camera-actions{ display:flex; gap:10px; margin-bottom:16px; }
  .camera-actions .btn{ margin-top:0; }
  .btn.outline{ background:transparent; color:var(--teal-700); border:1.5px solid var(--line); }
  .btn.outline:hover{ background:var(--mint-100); }
  .camera-status{ text-align:center; font-size:13px; color:var(--ink-500); margin-bottom:14px; }

  .btn{
    width:100%; padding:13px 14px; border-radius:12px; font-size:14px; font-family:'Inter',sans-serif;
    border:none; background:var(--teal-700); color:#fff; font-weight:700; cursor:pointer;
    margin-top:6px; transition:background .2s ease;
  }
  .btn:hover{ background:var(--teal-900); }
  .btn:disabled{ background:var(--line); color:var(--ink-500); cursor:not-allowed; }
  .btn:focus-visible{ outline:3px solid var(--gold-500); outline-offset:2px; }

  .banner{
    display:none; padding:12px 14px; border-radius:12px; font-size:13px; margin-bottom:16px;
  }
  .banner.show{ display:block; }
  .banner.success{ background:rgba(47,174,96,0.12); color:#1E7A45; }
  .banner.error{ background:rgba(179,49,26,0.1); color:var(--red-500); }

  .spinner-inline{
    width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff; animation:spin .8s linear infinite; display:inline-block;
    vertical-align:middle; margin-right:8px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
  <div class="head">
    <div class="eyebrow">Klinik Kesihatan Ayer Hitam</div>
    <h1>Add New Staff</h1>
    <div class="gold-dot"></div>
  </div>
  <div class="stage">

    <div class="banner" id="banner"></div>

    <div class="field">
      <label>Staff Photo</label>
      <div class="viewfinder" id="viewfinder">
        <div class="ring" id="camRing"></div>
        <video id="video" autoplay muted playsinline></video>
        <canvas id="snapshotCanvas"></canvas>
      </div>
      <div class="camera-status" id="camStatus">Starting camera…</div>
      <div class="camera-actions">
        <button class="btn" id="captureBtn" onclick="capturePhoto()" disabled>Capture Photo</button>
        <button class="btn outline" id="retakeBtn" onclick="retakePhoto()" style="display:none;">Retake</button>
      </div>
    </div>

    <div class="field">
      <label for="nameInput">Full Name</label>
      <input type="text" id="nameInput" placeholder="e.g. Ahmad bin Ismail">
    </div>

    <div class="field">
      <label for="icInput">IC Number</label>
      <input type="text" id="icInput" placeholder="e.g. 900101-01-1234">
    </div>

    <button class="btn" id="submitBtn" onclick="handleSubmit()">Add Staff Member</button>
  </div>
</div>

<script>
const API_URL = 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_EXEC_URL_HERE';
let selectedImageBase64 = null;
let stream = null;

const video = document.getElementById('video');
const canvas = document.getElementById('snapshotCanvas');
const viewfinder = document.getElementById('viewfinder');
const camRing = document.getElementById('camRing');
const camStatus = document.getElementById('camStatus');
const captureBtn = document.getElementById('captureBtn');
const retakeBtn = document.getElementById('retakeBtn');

window.addEventListener('DOMContentLoaded', startCamera);

async function startCamera(){
  camStatus.textContent = 'Starting camera…';
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video: { width:320, height:320 } });
    video.srcObject = stream;
    await new Promise(r => video.onloadedmetadata = r);
    camRing.classList.add('ready');
    camStatus.textContent = 'Center the face, then capture';
    captureBtn.disabled = false;
  }catch(err){
    camStatus.textContent = 'Camera access denied — please allow camera access and reload the page.';
    showBanner('Camera access is required to add a staff photo.', 'error');
  }
}

function capturePhoto(){
  canvas.width = 240; canvas.height = 240;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, 240, 240);
  selectedImageBase64 = canvas.toDataURL('image/jpeg', 0.85);

  viewfinder.classList.add('captured');
  camRing.classList.remove('ready');
  camRing.classList.add('captured');
  camStatus.textContent = 'Photo captured';
  captureBtn.style.display = 'none';
  retakeBtn.style.display = 'inline-block';
}

function retakePhoto(){
  selectedImageBase64 = null;
  viewfinder.classList.remove('captured');
  camRing.classList.remove('captured');
  camRing.classList.add('ready');
  camStatus.textContent = 'Center the face, then capture';
  captureBtn.style.display = 'inline-block';
  retakeBtn.style.display = 'none';
}

function showBanner(message, type){
  const banner = document.getElementById('banner');
  banner.textContent = message;
  banner.className = 'banner show ' + type;
}

async function handleSubmit(){
  const name = document.getElementById('nameInput').value.trim();
  const ic = document.getElementById('icInput').value.trim();
  const btn = document.getElementById('submitBtn');

  if(!name || !ic){ showBanner('Please fill in both name and IC number.', 'error'); return; }
  if(!selectedImageBase64){ showBanner('Please choose a photo.', 'error'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-inline"></span>Adding staff…';

  try{
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'addStaff', name, ic, imageBase64: selectedImageBase64 })
    });
    const data = await res.json();

    if(!data.ok){
      showBanner(data.error || 'Could not add staff member.', 'error');
    }else{
      showBanner(`${data.name} was added successfully.`, 'success');
      document.getElementById('nameInput').value = '';
      document.getElementById('icInput').value = '';
      retakePhoto();
    }
  }catch(err){
    showBanner('Network error — please try again.', 'error');
  }

  btn.disabled = false;
  btn.textContent = 'Add Staff Member';
}
</script>
</body>
</html>
