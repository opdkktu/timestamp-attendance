<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KKAH HR Portal · Borang Permohonan</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0B3D3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-900:#0B3D3A; --teal-700:#0F5C56; --teal-500:#1C8F84;
    --mint-100:#EAF6F2; --mint-050:#F6FBF9;
    --gold-500:#C9A227; --green-500:#2FAE60; --red-500:#B3311A;
    --ink-700:#1E2B29; --ink-500:#5B6B68; --line:#DCEAE6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:radial-gradient(1200px 800px at 50% -10%, var(--mint-100), var(--mint-050));
    font-family:'Inter',sans-serif; color:var(--ink-700);
    display:flex; align-items:flex-start; justify-content:center; padding:24px;
  }
  .card{ width:100%; max-width:460px; background:#fff; border-radius:28px; box-shadow:0 20px 60px -20px rgba(11,61,58,0.25); overflow:hidden; border:1px solid var(--line); }
  .head{ padding:22px 28px 18px; background:linear-gradient(135deg, var(--teal-900), var(--teal-700)); color:#fff; position:relative; }
  .head .eyebrow{ font-size:12px; letter-spacing:.08em; text-transform:uppercase; opacity:.75; font-weight:600; }
  .head h1{ font-family:'Manrope',sans-serif; font-size:20px; font-weight:800; margin:4px 0 0; }
  .back-link{ position:absolute; top:24px; right:28px; color:#fff; opacity:.8; text-decoration:none; font-size:13px; }
  .stage{ padding:26px 28px 28px; }

  .field{ margin-bottom:16px; }
  .field label{ font-size:12px; font-weight:700; color:var(--ink-500); display:block; margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em; }
  .field .readonly-box{
    background:var(--mint-100); border-radius:12px; padding:11px 13px; font-size:14px; font-weight:700; color:var(--teal-900);
  }
  textarea, select, input[type=date]{
    width:100%; padding:11px 13px; border-radius:12px; font-size:14px;
    border:1px solid var(--line); font-family:'Inter',sans-serif; color:var(--ink-700); background:#fff;
  }
  textarea{ resize:vertical; min-height:64px; }
  select:focus, textarea:focus, input:focus{ outline:none; border-color:var(--teal-500); box-shadow:0 0 0 3px rgba(28,143,132,0.15); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  .file-drop{
    border:1.5px dashed var(--line); border-radius:12px; padding:16px; text-align:center;
    font-size:13px; color:var(--ink-500); cursor:pointer; background:var(--mint-050);
  }
  .file-drop.has-file{ border-color:var(--teal-500); color:var(--teal-700); font-weight:700; }
  .file-drop input{ display:none; }

  .btn{
    width:100%; padding:13px 14px; border-radius:12px; font-size:14px; font-family:'Inter',sans-serif;
    border:1.5px solid var(--line); background:#fff; color:var(--ink-700); font-weight:700; cursor:pointer;
    margin-top:6px; transition:background .2s ease;
  }
  .btn.primary{ background:var(--teal-700); color:#fff; border:none; }
  .btn.primary:hover{ background:var(--teal-900); }
  .btn:disabled{ background:var(--line); color:var(--ink-500); cursor:not-allowed; }
  .btn:focus-visible{ outline:3px solid var(--gold-500); outline-offset:2px; }

  .banner{ display:none; padding:12px 14px; border-radius:12px; font-size:13px; margin-bottom:16px; }
  .banner.show{ display:block; }
  .banner.error{ background:rgba(179,49,26,0.1); color:var(--red-500); }

  /* Loading overlay */
  .loading-stage{ display:none; text-align:center; padding:60px 20px; }
  .loading-stage.show{ display:block; }
  .spinner{
    width:40px; height:40px; border-radius:50%; margin:0 auto 18px;
    border:4px solid var(--mint-100); border-top-color:var(--teal-700);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-stage p{ font-weight:700; color:var(--teal-900); }

  /* Success stage */
  .success-stage{ display:none; text-align:center; padding:40px 20px; }
  .success-stage.show{ display:block; }
  .success-icon{
    width:76px; height:76px; border-radius:50%; margin:0 auto 18px; background:var(--green-500);
    display:flex; align-items:center; justify-content:center; animation:pop .4s ease-out;
  }
  .success-icon::after{ content:''; width:22px; height:38px; border:solid white; border-width:0 5px 5px 0; transform:rotate(45deg); margin-top:-6px; }
  @keyframes pop{ from{ transform:scale(0); } to{ transform:scale(1); } }
  .success-stage h2{ font-family:'Manrope',sans-serif; color:var(--teal-900); margin:0 0 6px; }
  .success-stage p{ font-size:13px; color:var(--ink-500); margin-bottom:20px; }

  /* quota meters + rule overlay */
  .quota{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
  .qbox{ border:1.5px solid var(--line); border-radius:16px; padding:10px 12px; background:#fff; transition:border-color .3s, background .3s; }
  .qbox .ql{ font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-500); }
  .qbox .qn{ font:800 20px 'Manrope',sans-serif; margin:2px 0 6px; } .qbox .qn small{ font:600 12px 'Inter',sans-serif; color:var(--ink-500); }
  .qbar{ height:7px; border-radius:99px; background:#E6EFEC; overflow:hidden; } .qbar i{ display:block; height:100%; width:0; border-radius:99px; background:var(--green-500); transition:width .5s cubic-bezier(.2,.8,.2,1), background .3s; }
  .qbox.warn{ border-color:#E7B84B; background:#FFF8E6; } .qbox.warn .qbar i{ background:#E0A21A; } .qbox.warn .qn{ color:#8a5a00; }
  .qbox.full{ border-color:#E58A7B; background:#FDEEEB; } .qbox.full .qbar i{ background:var(--red-500); } .qbox.full .qn{ color:var(--red-500); }
  .qlink{ grid-column:1/-1; background:none; border:0; padding:0; font-size:12px; color:var(--teal-700); text-align:left; text-decoration:underline; cursor:pointer; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .lv-back{ position:fixed; inset:0; z-index:9000; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(11,30,28,.66); }
  .lv-back.show{ display:flex; animation:lvIn .25s ease; } @keyframes lvIn{ from{opacity:0} to{opacity:1} }
  .lv-card{ width:100%; max-width:380px; background:#fff; border-radius:26px; padding:26px 22px 20px; text-align:center; animation:lvPop .4s cubic-bezier(.2,1.1,.3,1); max-height:90vh; overflow:auto; }
  @keyframes lvPop{ from{ transform:translateY(24px) scale(.96); opacity:0 } to{ transform:none; opacity:1 } }
  .lv-ic{ width:68px; height:68px; margin:0 auto 10px; border-radius:50%; background:#FDEEEB; display:flex; align-items:center; justify-content:center; font-size:34px; }
  .lv-card h2{ margin:0 0 6px; font:800 20px 'Manrope',sans-serif; color:var(--red-500); } .lv-card p{ margin:0 0 10px; font-size:14px; line-height:1.55; color:var(--ink-700); }
  .lv-rule{ text-align:left; background:#FFF8E6; border:1px solid #F0D58A; border-radius:14px; padding:12px 14px; font-size:13px; line-height:1.55; color:#5c4400; margin:12px 0 4px; } .lv-rule b{ color:#7a1f10; }
  .lv-ok{ width:100%; margin-top:16px; border:0; border-radius:14px; padding:14px; min-height:48px; font:800 15px 'Manrope',sans-serif; color:#fff; background:var(--teal-700); cursor:pointer; }
  @media (prefers-reduced-motion:reduce){ .lv-card,.lv-back.show,.qbar i{ animation:none; transition:none } }
</style>
</head>
<body>

<div class="card">
  <div class="head">
    <div class="eyebrow">Klinik Kesihatan Ayer Hitam</div>
    <h1>Borang Permohonan</h1>
    <a class="back-link" href="./dashboard.html">← Dashboard</a>
  </div>

  <div class="stage" id="formStage">
    <div class="banner error" id="formBanner"></div>

    <div class="quota" id="quota" aria-live="polite">
      <div class="qbox" id="qM"><div class="ql" id="qMl">Bulan ini</div><div class="qn" id="qMn">–<small> / 2</small></div><div class="qbar"><i id="qMb"></i></div></div>
      <div class="qbox" id="qY"><div class="ql" id="qYl">Tahun ini</div><div class="qn" id="qYn">–<small> / 24</small></div><div class="qbar"><i id="qYb"></i></div></div>
      <button type="button" class="qlink" onclick="showRule(false)">ℹ️ Peraturan keluar pejabat</button>
    </div>

    <div class="field">
      <label>Pemohon</label>
      <div class="readonly-box" id="applicantName">Memuatkan…</div>
    </div>

    <div class="field">
      <label>Kepada (Pegawai Penyelia)</label>
      <div class="readonly-box" id="supervisorDisplay">TAN YI HAO</div>
    </div>

    <div class="field">
      <label for="tujuan">Tujuan</label>
      <textarea id="tujuan" required></textarea>
    </div>

    <div class="row2">
      <div class="field">
        <label for="jam_mula">Dari Jam</label>
        <select id="jam_mula"></select>
      </div>
      <div class="field">
        <label for="jam_tamat">Hingga Jam</label>
        <select id="jam_tamat"></select>
      </div>
    </div>

    <div class="field">
      <label for="tarikh">Tarikh</label>
      <input type="date" id="tarikh">
    </div>

    <div class="field">
      <label>Lampiran (Pilihan)</label>
      <label class="file-drop" id="fileDrop">
        <span id="fileDropText">📎 Ketik untuk pilih fail</span>
        <input type="file" id="fileInput">
      </label>
    </div>

    <button class="btn primary" id="submitBtn" onclick="handleSubmit()">Hantar Permohonan</button>
  </div>

  <div class="lv-back" id="lvBack" role="alertdialog" aria-modal="true" aria-labelledby="lvTitle"><div class="lv-card" id="lvCard"></div></div>

  <div class="loading-stage" id="loadingStage">
    <div class="spinner"></div>
    <p>Sedang menghantar permohonan…</p>
  </div>

  <div class="success-stage" id="successStage">
    <div class="success-icon"></div>
    <h2>Permohonan Berjaya!</h2>
    <p>Rekod anda telah disimpan.</p>
    <a class="btn primary" href="./jadual.html" style="display:block; text-decoration:none; box-sizing:border-box;">Semak Rekod Saya</a>
    <a class="btn" href="./dashboard.html" style="display:block; text-decoration:none; box-sizing:border-box; text-align:center;">Kembali ke Dashboard</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxOamlCtYPlZCvQOys1VTjkZu7aVqMsdDStTdytPex7eH5jNGuIBiR91BfougaEF3SI/exec';
// Shown as a label only — the backend still appends the authoritative
// CONFIG.SUPERVISOR_NAME regardless of what's displayed here. Update this
// string too once you add multi-unit supervisor routing.
const DEFAULT_SUPERVISOR_NAME = 'TAN YI HAO';

let selectedFile = null;

window.addEventListener('DOMContentLoaded', async () => {
  const token = sessionStorage.getItem('kkah_session_token');
  if(!token){ window.location.href = './login.html'; return; }

  document.getElementById('supervisorDisplay').textContent = DEFAULT_SUPERVISOR_NAME;
  document.getElementById('tarikh').valueAsDate = new Date();
  populateTimes();
  loadApplicantName();

  document.getElementById('fileInput').addEventListener('change', function(e){
    selectedFile = e.target.files[0] || null;
    const drop = document.getElementById('fileDrop');
    const text = document.getElementById('fileDropText');
    if(selectedFile){
      drop.classList.add('has-file');
      text.textContent = '✓ ' + selectedFile.name;
    }else{
      drop.classList.remove('has-file');
      text.textContent = '📎 Ketik untuk pilih fail';
    }
  });
});

async function loadApplicantName(){
  try{
    const res = await fetch(API_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'getMyProfile', token: sessionStorage.getItem('kkah_session_token') })
    });
    const data = await res.json();
    document.getElementById('applicantName').textContent = data.ok ? data.name : 'Tidak dijumpai';
  }catch(err){
    document.getElementById('applicantName').textContent = 'Ralat memuatkan nama';
  }
}

function populateTimes(){
  const start = document.getElementById('jam_mula');
  const end = document.getElementById('jam_tamat');
  for(let h = 8; h <= 17; h++){
    ['00', '30'].forEach(m => {
      if(h === 17 && m === '30') return;
      const t = (h < 10 ? '0'+h : h) + ':' + m;
      start.add(new Option(t, t));
      end.add(new Option(t, t));
    });
  }
  start.addEventListener('change', syncEndTime);
  syncEndTime();
}
function syncEndTime(){
  const [h, m] = document.getElementById('jam_mula').value.split(':').map(Number);
  const newH = Math.min(h + 1, 17);
  document.getElementById('jam_tamat').value = (newH < 10 ? '0'+newH : newH) + ':' + (m === 0 ? '00' : '30');
}

async function handleSubmit(){
  const tujuan = document.getElementById('tujuan').value.trim();
  const jam_mula = document.getElementById('jam_mula').value;
  const jam_tamat = document.getElementById('jam_tamat').value;
  const tarikh = document.getElementById('tarikh').value;
  const banner = document.getElementById('formBanner');

  if(!tujuan || !tarikh){
    banner.textContent = 'Sila lengkapkan semua medan yang diperlukan.';
    banner.classList.add('show');
    return;
  }

  document.getElementById('formStage').style.display = 'none';
  document.getElementById('loadingStage').classList.add('show');

  const payload = {
    action: 'submitLeaveRequest',
    token: sessionStorage.getItem('kkah_session_token'),
    tujuan, jam_mula, jam_tamat, tarikh,
    fileBase64: null, fileMimeType: null, fileName: null
  };

  const send = async () => {
    try{
      const res = await fetch(API_URL, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if(data.ok){
        document.getElementById('loadingStage').classList.remove('show');
        document.getElementById('successStage').classList.add('show');
        try{ confetti({ particleCount: 100, spread: 80, origin: { y: 0.5 } }); }catch(e){}
      }else{
        document.getElementById('loadingStage').classList.remove('show');
        document.getElementById('formStage').style.display = 'block';
        banner.textContent = data.error || 'Ralat tidak diketahui.';
        banner.classList.add('show');
        if(/^QUOTA_/.test(data.code || '')){ quota = Object.assign({ allowed:false, error:data.error }, data.quota || {}); loadQuota().then(() => showRule(true)); }
      }
    }catch(err){
      document.getElementById('loadingStage').classList.remove('show');
      document.getElementById('formStage').style.display = 'block';
      banner.textContent = 'Ralat rangkaian — sila cuba sebentar lagi.';
      banner.classList.add('show');
    }
  };

  if(selectedFile){
    const reader = new FileReader();
    reader.onload = function(e){
      payload.fileBase64 = e.target.result.split(',')[1];
      payload.fileMimeType = selectedFile.type;
      payload.fileName = selectedFile.name;
      send();
    };
    reader.readAsDataURL(selectedFile);
  }else{
    send();
  }
}

/* ---------- had permohonan keluar (server enforces it too) ---------- */
const CIRCULAR_REF = '';          // optional: e.g. 'Pekeliling Perkhidmatan Bil. X Tahun Y' — shown in the warning when filled
const MONTHS_MS = ['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
let quota = null, quotaShownFor = '';
function setBox(id, bid, nid, used, max, lvl){
  const b = document.getElementById(id); b.className = 'qbox' + (lvl === 'ok' ? '' : ' ' + lvl);
  document.getElementById(nid).innerHTML = used + '<small> / ' + max + '</small>';
  document.getElementById(bid).style.width = Math.min(100, used / max * 100) + '%';
}
async function loadQuota(){
  const tarikh = document.getElementById('tarikh').value;
  try{
    const res = await fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ action:'getLeaveQuota', token: sessionStorage.getItem('kkah_session_token'), tarikh }) });
    const q = await res.json(); if(!q || !q.ok) return;
    quota = q;
    const mi = Number(q.ym.slice(5)) - 1;
    document.getElementById('qMl').textContent = MONTHS_MS[mi] + ' ' + q.y;
    document.getElementById('qYl').textContent = 'Tahun ' + q.y;
    const mLvl = q.month.used >= q.month.max ? 'full' : (q.month.max > 1 && q.month.used >= q.month.max - 1 ? 'warn' : 'ok');
    const yLvl = q.year.used >= q.year.max ? 'full' : (q.year.used >= q.year.max - 4 ? 'warn' : 'ok');
    setBox('qM','qMb','qMn', q.month.used, q.month.max, mLvl); setBox('qY','qYb','qYn', q.year.used, q.year.max, yLvl);
    const btn = document.getElementById('submitBtn');
    btn.disabled = !q.allowed; btn.textContent = q.allowed ? 'Hantar Permohonan' : 'Had permohonan dicapai';
    if(!q.allowed && quotaShownFor !== q.ym){ quotaShownFor = q.ym; showRule(true); }
  }catch(e){}
}
function showRule(blocked){
  const q = quota;
  const head = blocked && q
    ? '<div class="lv-ic">⛔</div><h2 id="lvTitle">Had permohonan dicapai</h2><p>' + (q.error || '') + '<br>Bulan ini <b>' + q.month.used + '/' + q.month.max + '</b> · Tahun ini <b>' + q.year.used + '/' + q.year.max + '</b></p>'
    : '<div class="lv-ic" style="background:#FFF3D6">⚠️</div><h2 id="lvTitle" style="color:#8a5a00">Peraturan keluar pejabat</h2><p>Maksimum <b>2 kali sebulan</b> dan <b>24 kali setahun</b>. Mohon kebenaran penyelia <b>sebelum</b> keluar.</p>';
  document.getElementById('lvCard').innerHTML = head +
    '<div class="lv-rule">🚫 Keluar dari pejabat <b>tanpa kebenaran</b> boleh dikenakan <b>tindakan tatatertib</b> dan <b>kehilangan faedah ex gratia</b> mengikut pekeliling yang berkuat kuasa' + (CIRCULAR_REF ? ' (' + CIRCULAR_REF.replace(/[<>&]/g, '') + ')' : '') + '.</div>' +
    '<button class="lv-ok" id="lvOk" type="button">Saya faham</button>';
  document.getElementById('lvBack').classList.add('show');
  document.getElementById('lvOk').onclick = () => document.getElementById('lvBack').classList.remove('show');
  if(blocked && navigator.vibrate) try{ navigator.vibrate([40, 30, 40]); }catch(e){}
}
document.getElementById('tarikh').addEventListener('change', loadQuota);
loadQuota();
</script>
</body>
</html>
