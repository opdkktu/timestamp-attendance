<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pentadbir CME — SIAGA</title>
<link rel="icon" type="image/png" href="./siaga-192.png?v=1.1.0">
<link rel="apple-touch-icon" href="./siaga-512.png?v=1.1.0">
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{ --teal-900:#0B3D3A; --teal-700:#0F5C56; --teal-500:#1C8F84; --bg:#F3F8F6; --card:#fff; --ink-700:#1E2B29; --ink-500:#5B6B68; --line:#DCEAE6; --ok:#16a34a; --bad:#dc2626; --warn:#d97706; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--ink-700); font-family:'Inter',system-ui,sans-serif; padding-bottom:40px; }
  header{ background:linear-gradient(135deg,var(--teal-900),var(--teal-500)); color:#fff; padding:16px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:5; }
  header a{ color:#fff; text-decoration:none; font-size:22px; }
  header h1{ margin:0; font-family:'Manrope',sans-serif; font-size:18px; }
  main{ max-width:760px; margin:0 auto; padding:16px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 2px 10px rgba(11,61,58,.05); }
  .card h2{ margin:0 0 12px; font-family:'Manrope',sans-serif; font-size:16px; color:var(--teal-900); }
  .stats{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .stat{ background:var(--bg); border-radius:12px; padding:12px; text-align:center; }
  .stat b{ display:block; font-family:'Manrope',sans-serif; font-size:26px; color:var(--teal-700); }
  .stat span{ font-size:12px; color:var(--ink-500); }
  .bars{ display:flex; align-items:flex-end; gap:6px; height:110px; margin-top:14px; }
  .bar{ flex:1; background:linear-gradient(180deg,var(--teal-500),var(--teal-700)); border-radius:6px 6px 0 0; position:relative; min-height:3px; }
  .bar i{ position:absolute; top:-16px; left:0; right:0; text-align:center; font-size:10px; font-style:normal; color:var(--ink-500); }
  .bar em{ position:absolute; bottom:-18px; left:-4px; right:-4px; text-align:center; font-size:9px; font-style:normal; color:var(--ink-500); }
  label{ display:block; font-size:12px; font-weight:600; color:var(--ink-500); margin:10px 0 4px; }
  input,textarea{ width:100%; border:1.5px solid var(--line); border-radius:12px; padding:11px 12px; font:inherit; font-size:14px; background:#fff; }
  input:focus,textarea:focus{ outline:none; border-color:var(--teal-500); box-shadow:0 0 0 3px rgba(28,143,132,.15); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .btn{ width:100%; margin-top:14px; height:48px; border:none; border-radius:14px; background:linear-gradient(90deg,var(--teal-700),var(--teal-500)); color:#fff; font-weight:700; font-size:15px; cursor:pointer; }
  .btn:disabled{ opacity:.6; }
  .ses{ border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; }
  .ses .t{ font-weight:700; font-size:14px; color:var(--teal-900); }
  .ses .m{ font-size:12px; color:var(--ink-500); margin-top:2px; }
  .pill{ display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:99px; margin-left:6px; }
  .pill.valid{ background:#dcfce7; color:#166534; } .pill.notstarted{ background:#fef3c7; color:#92400e; } .pill.expired{ background:#f1f5f9; color:#64748b; }
  .acts{ display:flex; gap:8px; margin-top:10px; }
  .acts button{ flex:1; height:38px; border-radius:10px; border:1px solid var(--line); background:#fff; font-weight:700; font-size:12.5px; color:var(--teal-900); cursor:pointer; }
  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(80px); background:#111; color:#fff; padding:12px 18px; border-radius:12px; font-size:13px; transition:.3s; z-index:60; max-width:90%; }
  .toast.show{ transform:translateX(-50%) translateY(0); }
  .overlay{ position:fixed; inset:0; background:rgba(8,20,18,.55); display:none; align-items:center; justify-content:center; z-index:40; padding:16px; }
  .overlay.show{ display:flex; }
  .modal{ background:#fff; border-radius:20px; padding:20px; width:100%; max-width:420px; max-height:88vh; overflow:auto; text-align:center; }
  .modal h3{ margin:0 0 4px; font-family:'Manrope',sans-serif; color:var(--teal-900); font-size:16px; }
  #qrBox{ display:flex; justify-content:center; margin:14px 0; } #qrBox img,#qrBox canvas{ border:8px solid #fff; border-radius:8px; }
  .link{ font-size:11px; color:var(--ink-500); word-break:break-all; background:var(--bg); padding:8px; border-radius:8px; }
  .plist{ text-align:left; font-size:13px; } .plist div{ padding:8px 0; border-bottom:1px solid var(--line); } .plist small{ color:var(--ink-500); }
  .close{ margin-top:14px; width:100%; height:44px; border-radius:12px; border:none; background:var(--bg); font-weight:700; cursor:pointer; }
  .empty{ text-align:center; color:var(--ink-500); font-size:13px; padding:14px; }
  @media print{ header,.card,.toast,.close,.acts{ display:none !important; } .overlay{ position:static; background:#fff; display:block; } }
</style>
</head>
<body>
<header><a href="./dashboard.html" aria-label="Kembali">←</a><h1>Pentadbir CME</h1></header>
<main>
  <section class="card"><h2>Statistik keseluruhan</h2>
    <div class="stats"><div class="stat"><b id="stSes">–</b><span>Jumlah sesi</span></div><div class="stat"><b id="stAtt">–</b><span>Jumlah kehadiran</span></div></div>
    <div class="bars" id="bars"></div>
    <div id="top" style="margin-top:30px;font-size:13px;"></div>
  </section>

  <section class="card"><h2>Cipta sesi CME baharu</h2>
    <label>Topik</label><input id="fTopic" maxlength="120">
    <div class="row2"><div><label>Tarikh</label><input id="fDate" type="date"></div><div><label>Masa mula</label><input id="fTime" type="time"></div></div>
    <div class="row2"><div><label>Lokasi</label><input id="fLoc" maxlength="80"></div><div><label>Mata CPD</label><input id="fCpd" type="number" min="0" step="0.5" value="1"></div></div>
    <label>Penyampai</label><input id="fPres" maxlength="80">
    <label>Keterangan (pilihan)</label><textarea id="fDesc" rows="2" maxlength="300"></textarea>
    <button class="btn" id="btnCreate">Cipta sesi &amp; papar QR</button>
  </section>

  <section class="card"><h2>Senarai sesi</h2><div id="list"><div class="empty">Memuatkan…</div></div></section>
</main>

<div class="overlay" id="qrOv"><div class="modal">
  <h3 id="qrTitle"></h3><div style="font-size:12px;color:var(--ink-500)" id="qrMeta"></div>
  <div id="qrBox"></div><div class="link" id="qrLink"></div>
  <div class="acts"><button onclick="window.print()">🖨 Cetak</button><button onclick="copyLink()">Salin pautan</button></div>
  <button class="close" onclick="closeOv('qrOv')">Tutup</button>
</div></div>
<div class="overlay" id="pOv"><div class="modal">
  <h3 id="pTitle">Peserta</h3><div style="font-size:12px;color:var(--ink-500);margin-bottom:8px" id="pSub"></div>
  <div class="plist" id="pList"></div><button class="close" onclick="closeOv('pOv')">Tutup</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxOamlCtYPlZCvQOys1VTjkZu7aVqMsdDStTdytPex7eH5jNGuIBiR91BfougaEF3SI/exec';
const SIAGA_BASE = 'https://opdkktu.github.io/timestamp-attendance/dashboard.html'; // QR opens SIAGA, identity comes from the login
const token = sessionStorage.getItem('kkah_session_token');
const role = sessionStorage.getItem('kkah_role');
if(!token){ location.href = './login.html'; }
else if(role !== 'admin' && role !== 'superadmin'){ alert('Halaman ini untuk pentadbir sahaja.'); location.href = './dashboard.html'; }

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2600); }
function closeOv(id){ document.getElementById(id).classList.remove('show'); }
async function api(action, extra){
  const r = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({ action, token }, extra||{})) });
  const d = await r.json();
  if(d && d.error && /expired|log in/i.test(d.error)){ sessionStorage.removeItem('kkah_session_token'); location.href = './login.html'; }
  return d;
}

let sessions = [], curLink = '';
async function load(){
  let d; try{ d = await api('cmeAdminOverview'); }catch(e){ d = { ok:false, error:'Ralat sambungan.' }; }
  if(!d.ok){ document.getElementById('list').innerHTML = '<div class="empty">' + esc(d.error) + '</div>'; return; }
  sessions = d.sessions;
  document.getElementById('stSes').textContent = d.stats.totalSessions;
  document.getElementById('stAtt').textContent = d.stats.totalAttendance;
  const max = Math.max(1, ...d.stats.months.map(m => m.attendance));
  document.getElementById('bars').innerHTML = d.stats.months.map(m =>
    '<div class="bar" style="height:' + Math.max(3, m.attendance / max * 100) + '%"><i>' + m.attendance + '</i><em>' + m.month.slice(2) + '</em></div>').join('') || '<div class="empty" style="width:100%">Tiada data</div>';
  document.getElementById('top').innerHTML = d.stats.topPresenters.length ?
    '<b>Penyampai teratas</b>' + d.stats.topPresenters.map(p => '<div style="padding:4px 0">' + esc(p.name) + ' — ' + p.sessions + ' sesi</div>').join('') : '';
  const lbl = { valid:'QR aktif', notstarted:'Belum bermula', expired:'Tamat' };
  document.getElementById('list').innerHTML = sessions.length ? sessions.map((s, i) =>
    '<div class="ses"><div class="t">' + esc(s.topic) + '<span class="pill ' + (lbl[s.qrState] ? s.qrState : 'expired') + '">' + (lbl[s.qrState] || '—') + '</span></div>' +
    '<div class="m">' + esc(s.date) + ' ' + esc(s.time) + ' · ' + esc(s.location) + ' · ' + esc(s.presenter) + '</div>' +
    '<div class="m"><b>' + s.count + '</b> hadir · ' + s.cpd + ' CPD</div>' +
    '<div class="acts"><button onclick="showQr(' + i + ')">QR</button><button onclick="showPeople(' + i + ')">Peserta</button></div></div>').join('')
    : '<div class="empty">Belum ada sesi.</div>';
}

function showQr(i){
  const s = sessions[i]; curLink = SIAGA_BASE + '?cme=' + encodeURIComponent(s.id);
  document.getElementById('qrTitle').textContent = s.topic;
  document.getElementById('qrMeta').textContent = s.date + ' ' + s.time + ' · ' + s.location;
  const box = document.getElementById('qrBox'); box.innerHTML = '';
  new QRCode(box, { text: curLink, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M });
  document.getElementById('qrLink').textContent = curLink;
  document.getElementById('qrOv').classList.add('show');
}
function copyLink(){ (navigator.clipboard ? navigator.clipboard.writeText(curLink) : Promise.reject()).then(() => toast('Pautan disalin'), () => toast('Salin manual dari kotak pautan')); }

async function showPeople(i){
  const s = sessions[i];
  document.getElementById('pTitle').textContent = s.topic; document.getElementById('pSub').textContent = 'Memuatkan…';
  document.getElementById('pList').innerHTML = ''; document.getElementById('pOv').classList.add('show');
  const d = await api('cmeAdminParticipants', { sessionId: s.id });
  if(!d.ok){ document.getElementById('pSub').textContent = d.error || 'Gagal'; return; }
  document.getElementById('pSub').textContent = d.participants.length + ' peserta';
  document.getElementById('pList').innerHTML = d.participants.map((p, n) =>
    '<div>' + (n + 1) + '. <b>' + esc(p.name) + '</b><br><small>' + esc(p.position || p.dept || '') + ' · ' +
    (p.at ? new Date(p.at).toLocaleTimeString('ms-MY', {hour:'2-digit',minute:'2-digit'}) : '') + '</small></div>').join('') || '<div class="empty">Tiada peserta lagi.</div>';
}

document.getElementById('btnCreate').onclick = async function(){
  const v = id => document.getElementById(id).value.trim();
  const body = { topic:v('fTopic'), date:v('fDate'), time:v('fTime'), location:v('fLoc'), presenter:v('fPres'), description:v('fDesc'), cpdPoints:v('fCpd') };
  if(!body.topic || !body.date || !body.time || !body.location || !body.presenter){ toast('Sila lengkapkan semua ruangan wajib'); return; }
  this.disabled = true; this.textContent = 'Mencipta…';
  let d; try{ d = await api('cmeAdminCreate', body); }catch(e){ d = { ok:false, error:'Ralat sambungan.' }; }
  this.disabled = false; this.textContent = 'Cipta sesi & papar QR';
  if(!d.ok){ toast(d.error || 'Gagal'); return; }
  ['fTopic','fLoc','fPres','fDesc'].forEach(id => document.getElementById(id).value = '');
  toast('Sesi dicipta');
  await load();
  const i = sessions.findIndex(s => s.id === d.sessionId); if(i >= 0) showQr(i);
};
if(token) load();
</script>
</body>
</html>
