<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIAGA · Clinical Guideline Library</title>
<link rel="icon" type="image/png" href="./siaga-192.png">
<link rel="apple-touch-icon" href="./siaga-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0B3D3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --g9:#0B3D3A; --g7:#14706A; --g5:#1C8F84; --mint:#E2F2EF; --bg:#F4F9F8; --ink:#17282a; --ink2:#586c6e; --line:#D3E4E1; --gold:#C9A227; --mk:#FFE27A; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; min-height:100vh; background:radial-gradient(1200px 800px at 50% -10%, var(--mint), var(--bg)); font-family:'Inter',sans-serif; color:var(--ink); padding:12px 12px 60px; }
  .wrap{ max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
  .head{ border-radius:22px; padding:16px 18px; color:#fff; background:linear-gradient(135deg,var(--g9),var(--g5)); display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .head .eb{ font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; opacity:.78; font-weight:700; }
  .head h1{ font:800 20px 'Manrope',sans-serif; margin:2px 0 0; }
  .back{ color:#fff; text-decoration:none; font-weight:700; font-size:13px; padding:9px 14px; border-radius:99px; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.3); white-space:nowrap; }
  .bar{ position:sticky; top:0; z-index:20; background:linear-gradient(var(--bg) 82%, rgba(244,249,248,0)); padding:4px 0 8px; display:flex; flex-direction:column; gap:8px; }
  .sb{ display:flex; gap:8px; }
  .sb input{ flex:1; min-width:0; height:54px; border-radius:16px; border:1.5px solid var(--line); padding:0 16px; font:600 17px 'Inter',sans-serif; background:#fff; box-shadow:0 10px 24px -20px rgba(11,61,58,.7); }
  .sb input:focus{ outline:none; border-color:var(--g5); box-shadow:0 0 0 3px rgba(28,143,132,.18); }
  .sb button{ width:54px; height:54px; border-radius:16px; border:none; background:linear-gradient(135deg,var(--g9),var(--g5)); color:#fff; font-size:20px; cursor:pointer; }
  .chips{ display:flex; gap:7px; overflow-x:auto; padding:2px 1px 4px; scrollbar-width:none; } .chips::-webkit-scrollbar{ display:none; }
  .chip{ flex:0 0 auto; min-height:40px; padding:0 13px; border-radius:99px; border:1.5px solid var(--line); background:#fff; font:700 12.5px 'Manrope',sans-serif; color:var(--ink); cursor:pointer; display:flex; align-items:center; gap:6px; }
  .chip small{ font:700 11px 'Inter',sans-serif; opacity:.6; } .chip[aria-pressed="true"]{ background:var(--g9); border-color:var(--g9); color:#fff; }
  .hint{ font-size:12px; color:var(--ink2); line-height:1.5; padding:0 4px; } .hint code{ background:#fff; border:1px solid var(--line); border-radius:6px; padding:1px 6px; font-size:11.5px; }
  .sum{ font-size:12.5px; color:var(--ink2); font-weight:600; padding:0 4px; }
  .res{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:13px 14px; display:flex; flex-direction:column; gap:8px; }
  .res .t{ font:800 15px 'Manrope',sans-serif; line-height:1.3; word-break:break-word; }
  .meta{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .tag{ font-size:11px; font-weight:800; padding:3px 9px; border-radius:99px; background:var(--mint); color:var(--g7); }
  .tag.pg{ background:var(--g9); color:#fff; } .tag.ocr{ background:#FFF3D6; color:#8a6d0a; } .tag.part{ background:#FDE9E5; color:#b3311a; }
  .sec{ font-size:12.5px; color:var(--ink2); font-weight:600; } .upd{ font-size:11.5px; color:var(--ink2); }
  .ex{ white-space:pre-wrap; word-break:break-word; font-size:14px; line-height:1.6; background:#F7FBFA; border-left:3px solid var(--g5); border-radius:6px; padding:9px 12px; }
  mark{ background:var(--mk); color:inherit; border-radius:3px; padding:0 1px; font-weight:700; }
  .open{ align-self:flex-start; min-height:44px; display:inline-flex; align-items:center; padding:0 16px; border-radius:13px; background:var(--g9); color:#fff; text-decoration:none; font:800 13.5px 'Manrope',sans-serif; }
  .more{ min-height:50px; border-radius:14px; border:1.5px solid var(--line); background:#fff; font:800 14px 'Manrope',sans-serif; color:var(--g7); cursor:pointer; }
  .empty{ text-align:center; padding:28px 12px; color:var(--ink2); font-size:14px; line-height:1.6; }
  .spin{ width:22px; height:22px; border:3px solid var(--line); border-top-color:var(--g7); border-radius:50%; animation:sp .8s linear infinite; margin:0 auto 8px; } @keyframes sp{ to{ transform:rotate(360deg); } }
  .prog{ height:4px; background:var(--line); border-radius:4px; overflow:hidden; margin:6px 4px 0; } .prog i{ display:block; height:100%; width:0; background:var(--g5); transition:width .2s; }
  .lib h3{ margin:14px 4px 6px; font:800 14px 'Manrope',sans-serif; color:var(--g9); }
  .doc{ background:#fff; border:1px solid var(--line); border-radius:15px; padding:11px 13px; display:flex; gap:10px; align-items:center; margin-bottom:8px; }
  .doc .m{ flex:1; min-width:0; } .doc .n{ font-weight:700; font-size:14px; line-height:1.3; word-break:break-word; } .doc .s{ font-size:12px; color:var(--ink2); margin-top:2px; }
  .doc a{ min-height:42px; display:flex; align-items:center; padding:0 13px; border-radius:12px; background:var(--mint); color:var(--g9); font:800 12.5px 'Manrope',sans-serif; text-decoration:none; }
  :focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
</style>
<script src="./version.js"></script>
<script src="./version-ui.js"></script>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><div class="eb">Klinik Kesihatan Ayer Hitam</div><h1>📚 Clinical Guideline Library</h1></div>
    <a class="back" href="./dashboard.html">← Dashboard</a>
  </div>

  <div class="bar">
    <form class="sb" id="f" autocomplete="off" role="search">
      <input id="q" type="search" enterkeyhint="search" maxlength="120" placeholder="Cari: metformin, “eGFR <30”, HbA1c target…" aria-label="Cari dalam garis panduan">
      <button type="submit" aria-label="Cari">🔍</button>
    </form>
    <div class="chips" id="cats" role="group" aria-label="Penapis kategori"></div>
  </div>
  <div class="hint" id="hint">Taip satu atau lebih perkataan. Guna <code>"petikan tepat"</code> untuk frasa, atau sebahagian perkataan (cth. <code>hipoglis</code>). Tidak sensitif huruf besar/kecil.</div>
  <div class="prog" id="prog" hidden><i id="progI"></i></div>
  <div class="sum" id="sum"></div>
  <div id="out" style="display:flex;flex-direction:column;gap:10px"></div>
</div>

<script>
const BASE = './guidelines/';
const $ = id => document.getElementById(id);
if(!sessionStorage.getItem('kkah_session_token')) location.href = './login.html';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const dmy = iso => { const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; };

/* ---------------- data: manifest + per-document pages (cached in IndexedDB) ---------------- */
let MAN = null, selCats = new Set(), DOCS = {}, loadingAll = false;
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open('kkah_guidelines', 1); r.onupgradeneeded = () => r.result.createObjectStore('docs'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k){ try{ const db = await idb(); return await new Promise(res => { const q = db.transaction('docs').objectStore('docs').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); }catch(e){ return null; } }
async function idbPut(k, v){ try{ const db = await idb(); db.transaction('docs', 'readwrite').objectStore('docs').put(v, k); }catch(e){} }
async function loadDoc(d){
  if(DOCS[d.id]) return DOCS[d.id];
  const key = d.id + '@' + d.hash, hit = await idbGet(key);
  let o = hit;
  if(!o){ const r = await fetch(BASE + 'data/' + d.id + '.json?h=' + d.hash); if(!r.ok) throw new Error(d.id); o = await r.json(); idbPut(key, o); }
  o.pages.forEach(p => { p.l = p.t.toLowerCase(); });
  o.meta = d; DOCS[d.id] = o; return o;
}
async function loadMany(list){
  const todo = list.filter(d => !DOCS[d.id]); if(!todo.length) return;
  $('prog').hidden = false; let n = 0;
  const q = todo.slice();
  await Promise.all(Array.from({ length: 4 }, async () => { while(q.length){ const d = q.shift(); try{ await loadDoc(d); }catch(e){} $('progI').style.width = (++n / todo.length * 100) + '%'; } }));
  $('prog').hidden = true; $('progI').style.width = '0';
}
const activeDocs = () => MAN.docs.filter(d => !selCats.size || selCats.has(d.category));

/* ---------------- search ---------------- */
function parseQuery(raw){
  const phrases = [], terms = [];
  const rest = raw.replace(/["“”]([^"“”]+)["“”]/g, (_, p) => { const t = p.trim().toLowerCase().replace(/\s+/g, ' '); if(t) phrases.push(t); return ' '; });
  rest.toLowerCase().split(/\s+/).forEach(w => { w = w.replace(/^[^\p{L}\p{N}<>≥≤±µ%]+|[^\p{L}\p{N}<>≥≤±µ%]+$/gu, ''); if(w) terms.push(w); });
  const whole = (!phrases.length && terms.length > 1) ? terms.join(' ') : '';          // unquoted words: the same words next to each other still rank first
  return { phrases, terms, whole };
}
function allIdx(hay, needle, max){ const o = []; let i = 0; while(o.length < (max || 400) && (i = hay.indexOf(needle, i)) >= 0){ o.push(i); i += Math.max(needle.length, 1); } return o; }
const isWordStart = (s, i) => i === 0 || !/[\p{L}\p{N}]/u.test(s[i - 1]);
function scorePage(doc, pg, Q, mode){
  const L = pg.l, pos = [];                                                    // pos: [index, length, termIndex, weight]
  let score = 0, phraseHit = 0, termsHit = 0;
  const need = Q.terms.length;
  const phr = Q.phrases.concat(Q.whole ? [Q.whole] : []);
  phr.forEach(p => { const ix = allIdx(L, p); if(ix.length){ phraseHit++; score += (Q.phrases.includes(p) ? 120 : 70) + Math.min(ix.length, 5) * 6; ix.forEach(i => pos.push([i, p.length, -1, 3])); } });
  if(Q.phrases.length && phraseHit < Q.phrases.length && mode === 'and') return null;
  const perTerm = Q.terms.map((t, ti) => {
    const ix = allIdx(L, t); if(!ix.length) return null;
    const ws = ix.filter(i => isWordStart(L, i)).length;
    ix.forEach(i => pos.push([i, t.length, ti, isWordStart(L, i) ? 2 : 1]));
    return { ix, ws };
  });
  perTerm.forEach(x => { if(x){ termsHit++; score += (x.ws ? 14 : 5) + Math.min(Math.log2(1 + x.ix.length) * 3, 9); } });
  if(mode === 'and' && termsHit < need) return null;
  if(mode === 'or' && !phraseHit && !termsHit) return null;
  if(need > 1 && termsHit === need){                                           // all words close together
    const firsts = perTerm.map(x => x.ix.slice(0, 40)); let best = 1e9;
    firsts[0].forEach(a => { let lo = a, hi = a; for(let k = 1; k < firsts.length; k++){ let d = 1e9, pick = a; firsts[k].forEach(b => { if(Math.abs(b - a) < d){ d = Math.abs(b - a); pick = b; } }); lo = Math.min(lo, pick); hi = Math.max(hi, pick); } best = Math.min(best, hi - lo); });
    if(best < 80) score += 36; else if(best < 250) score += 24; else if(best < 700) score += 10;
  }
  const hay = (doc.title + ' ' + (pg.h || []).map(h => h[1]).join(' ')).toLowerCase();                  // title / heading words count extra
  Q.terms.concat(Q.phrases).forEach(t => { if(hay.indexOf(t) >= 0) score += 12; });
  return { score, pos, phraseHit, termsHit };
}
function headingAt(pg, i){ let h = ''; (pg.h || []).forEach(x => { if(x[0] <= i) h = x[1]; }); return h; }
function excerpt(pg, pos, Q){
  const t = pg.t, W = 150;
  let centre = 0;
  if(pos.length){
    const ph = pos.filter(p => p[2] === -1).sort((a, b) => a[0] - b[0])[0];
    if(ph) centre = ph[0];
    else { let bestN = -1; pos.forEach(p => { const set = new Set(); pos.forEach(q => { if(Math.abs(q[0] - p[0]) < 260 && q[2] >= 0) set.add(q[2]); }); if(set.size > bestN){ bestN = set.size; centre = p[0]; } }); }
  }
  let a = Math.max(0, centre - W), b = Math.min(t.length, centre + W + 60);
  if(a > 0){ const j = t.indexOf(' ', a); if(j > 0 && j < centre) a = j + 1; }
  if(b < t.length){ const j = t.lastIndexOf(' ', b); if(j > centre) b = j; }
  return { text: t.slice(a, b), from: a, centre, pre: a > 0, post: b < t.length };
}
function highlight(s, Q){
  const parts = Q.phrases.concat(Q.whole ? [Q.whole] : []).map(p => reEsc(p).replace(/ /g, '\\s+')).concat(Q.terms.map(reEsc));
  if(!parts.length) return esc(s);
  parts.sort((a, b) => b.length - a.length);
  const re = new RegExp('(' + parts.join('|') + ')', 'giu');
  let out = '', last = 0, m;
  while((m = re.exec(s))){ if(!m[0]) { re.lastIndex++; continue; } out += esc(s.slice(last, m.index)) + '<mark>' + esc(m[0]) + '</mark>'; last = m.index + m[0].length; }
  return out + esc(s.slice(last));
}

let results = [], shown = 0, curQ = null, token = 0;
async function runSearch(){
  const raw = $('q').value.trim(), my = ++token;
  try{ const u = new URL(location.href); raw ? u.searchParams.set('q', raw) : u.searchParams.delete('q'); history.replaceState(null, '', u); }catch(e){}
  if(!raw){ results = []; renderLibrary(); return; }
  const Q = parseQuery(raw); curQ = Q;
  if(!Q.terms.length && !Q.phrases.length){ $('out').innerHTML = ''; return; }
  const docs = activeDocs();
  if(!docs.length){ $('out').innerHTML = '<div class="empty">Tiada dokumen dalam kategori ini.</div>'; return; }
  $('out').innerHTML = '<div class="empty"><div class="spin"></div>Memuat indeks…</div>';
  await loadMany(docs); if(my !== token) return;
  let mode = 'and', list = collect(docs, Q, 'and');
  if(!list.length && (Q.terms.length + Q.phrases.length) > 1){ mode = 'or'; list = collect(docs, Q, 'or'); }
  list.sort((a, b) => b.r.score - a.r.score);
  results = list; shown = 0; $('out').innerHTML = '';
  $('sum').textContent = list.length ? list.length + ' halaman dijumpai' + (new Set(list.map(x => x.doc.id)).size > 1 ? ' dalam ' + new Set(list.map(x => x.doc.id)).size + ' dokumen' : '') + (mode === 'or' ? ' — padanan separa (tiada halaman mengandungi semua perkataan)' : '') : '';
  if(!list.length){ $('out').innerHTML = '<div class="empty">Tiada hasil untuk <b>' + esc(raw) + '</b>.<br>Cuba perkataan lebih pendek (cth. “hipoglis”), semak ejaan, atau pilih “Semua” kategori.</div>'; return; }
  more(mode);
}
function collect(docs, Q, mode){
  const out = [];
  docs.forEach(d => { const o = DOCS[d.id]; if(!o) return; o.pages.forEach(pg => { const r = scorePage(o, pg, Q, mode); if(r) out.push({ doc: o, pg, r }); }); });
  return out;
}
function more(mode){
  const slice = results.slice(shown, shown + 25); shown += slice.length;
  const old = document.getElementById('moreBtn'); if(old) old.remove();
  $('out').insertAdjacentHTML('beforeend', slice.map(x => card(x, mode)).join(''));
  if(shown < results.length) $('out').insertAdjacentHTML('beforeend', '<button class="more" id="moreBtn" type="button">Papar lagi (' + (results.length - shown) + ')</button>');
}
function card(x, mode){
  const ex = excerpt(x.pg, x.r.pos, curQ), sec = headingAt(x.pg, ex.centre), m = x.doc.meta;
  const first = (curQ.phrases[0] || curQ.terms[0] || '');
  const href = BASE + m.pdf + '#page=' + x.pg.p + (first ? '&search=' + encodeURIComponent(first) : '');
  return '<article class="res"><div class="t">' + esc(m.title) + '</div><div class="meta"><span class="tag pg">Muka surat ' + x.pg.p + '</span><span class="tag">' + esc(m.category) + '</span>' +
    (x.pg.ocr ? '<span class="tag ocr" title="Teks dibaca melalui OCR — semak PDF asal">OCR</span>' : '') + (mode === 'or' ? '<span class="tag part">Separa</span>' : '') +
    (m.updated ? '<span class="upd">Dikemas kini ' + esc(dmy(m.updated)) + '</span>' : '') + '</div>' +
    (sec ? '<div class="sec">§ ' + esc(sec) + '</div>' : '') +
    '<div class="ex">' + (ex.pre ? '… ' : '') + highlight(ex.text, curQ) + (ex.post ? ' …' : '') + '</div>' +
    '<a class="open" href="' + esc(href) + '" target="_blank" rel="noopener">📄 Buka PDF asal (ms ' + x.pg.p + ') ›</a></article>';
}
$('out').addEventListener('click', e => { if(e.target.id === 'moreBtn') more(); });

/* ---------------- library list + category filter ---------------- */
function renderCats(){
  const counts = {}; MAN.docs.forEach(d => counts[d.category] = (counts[d.category] || 0) + 1);
  $('cats').innerHTML = '<button class="chip" data-c="*" aria-pressed="' + !selCats.size + '">Semua <small>' + MAN.docs.length + '</small></button>' +
    MAN.categories.map(c => '<button class="chip" data-c="' + esc(c) + '" aria-pressed="' + selCats.has(c) + '">' + esc(c) + ' <small>' + counts[c] + '</small></button>').join('');
}
$('cats').addEventListener('click', e => {
  const b = e.target.closest('[data-c]'); if(!b) return;
  if(b.dataset.c === '*') selCats.clear(); else { selCats.has(b.dataset.c) ? selCats.delete(b.dataset.c) : selCats.add(b.dataset.c); }
  renderCats(); $('q').value.trim() ? runSearch() : renderLibrary();
});
function renderLibrary(){
  $('sum').textContent = '';
  const docs = activeDocs(), by = {};
  docs.forEach(d => (by[d.category] = by[d.category] || []).push(d));
  $('out').innerHTML = docs.length ? '<div class="lib">' + Object.keys(by).map(c => '<h3>' + esc(c) + '</h3>' + by[c].map(d =>
    '<div class="doc"><div class="m"><div class="n">' + esc(d.title) + '</div><div class="s">' + d.pages + ' muka surat' + (d.updated ? ' · dikemas kini ' + esc(dmy(d.updated)) : '') + (d.ref ? ' · ' + esc(d.ref) : '') + (d.ocrPages ? ' · ' + d.ocrPages + ' ms OCR' : '') + '</div></div><a href="' + esc(BASE + d.pdf) + '" target="_blank" rel="noopener">📄 PDF</a></div>').join('')).join('') + '</div>'
    : '<div class="empty">Belum ada dokumen.</div>';
}
$('f').addEventListener('submit', e => { e.preventDefault(); runSearch(); try{ $('q').blur(); }catch(_){} });
let deb; $('q').addEventListener('input', () => { clearTimeout(deb); deb = setTimeout(runSearch, 280); });

(async function init(){
  try{
    const r = await fetch(BASE + 'manifest.json?t=' + Math.floor(Date.now() / 600000)); if(!r.ok) throw 0;
    MAN = await r.json();
  }catch(e){ $('out').innerHTML = '<div class="empty">Indeks garis panduan belum tersedia.<br>Jalankan <code>build_guideline_index.py</code> dan muat naik folder <code>guidelines/</code>.</div>'; return; }
  renderCats();
  const q0 = new URLSearchParams(location.search).get('q'); if(q0) $('q').value = q0;
  $('q').value.trim() ? runSearch() : renderLibrary();
  setTimeout(() => { if(!loadingAll){ loadingAll = true; loadMany(MAN.docs).catch(() => {}); } }, 1200);        // warm every document in the background for instant searches
})();
</script>
</body>
</html>
