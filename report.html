<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KKAH · My Attendance Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-900:#0B3D3A; --teal-700:#0F5C56; --teal-500:#1C8F84;
    --mint-100:#EAF6F2; --mint-050:#F6FBF9;
    --gold-500:#C9A227; --green-500:#2FAE60;
    --ink-700:#1E2B29; --ink-500:#5B6B68; --line:#DCEAE6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:radial-gradient(1200px 800px at 50% -10%, var(--mint-100), var(--mint-050));
    font-family:'Inter',sans-serif; color:var(--ink-700);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:440px; background:#fff; border-radius:28px;
    box-shadow:0 20px 60px -20px rgba(11,61,58,0.25);
    overflow:hidden; border:1px solid var(--line);
  }
  .head{
    padding:22px 28px 18px;
    background:linear-gradient(135deg, var(--teal-900), var(--teal-700));
    color:#fff; position:relative;
  }
  .head .eyebrow{ font-size:12px; letter-spacing:.08em; text-transform:uppercase; opacity:.75; font-weight:600; }
  .head h1{ font-family:'Manrope',sans-serif; font-size:20px; font-weight:800; margin:4px 0 0; }
  .gold-dot{ position:absolute; top:22px; right:26px; width:8px;height:8px;border-radius:50%; background:var(--gold-500); box-shadow:0 0 0 4px rgba(201,162,39,0.18); }
  .stage{ padding:28px; }

  .viewfinder{ position:relative; width:200px; height:200px; margin:0 auto 18px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .viewfinder video{ width:170px; height:170px; border-radius:50%; object-fit:cover; background:#0B3D3A; }
  .ring{ position:absolute; inset:0; border-radius:50%; border:3px solid var(--line); transition:border-color .4s ease; }
  .ring.scanning{ border-color:var(--teal-500); animation:pulse 1.6s ease-in-out infinite; }
  .ring.success{ border-color:var(--green-500); box-shadow:0 0 0 8px rgba(47,174,96,0.15); }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(28,143,132,.25);} 50%{ box-shadow:0 0 0 12px rgba(28,143,132,0);} }

  .status-line{ text-align:center; font-size:14px; color:var(--ink-500); min-height:20px; margin-bottom:6px; }

  .welcome{ display:none; text-align:center; }
  .welcome.show{ display:block; }
  .welcome h2{ font-family:'Manrope',sans-serif; font-size:20px; color:var(--teal-900); margin:0 0 4px; }
  .welcome .ic{ font-size:13px; color:var(--ink-500); margin-bottom:20px; }

  .field{ margin-bottom:14px; text-align:left; }
  .field label{ font-size:12px; font-weight:600; color:var(--ink-500); display:block; margin-bottom:6px; }
  select, .btn{
    width:100%; padding:12px 14px; border-radius:12px; font-size:14px; font-family:'Inter',sans-serif;
  }
  select{ border:1px solid var(--line); background:#fff; color:var(--ink-700); }
  .btn{
    border:none; background:var(--teal-700); color:#fff; font-weight:700; cursor:pointer;
    margin-top:6px; transition:background .2s ease;
  }
  .btn:hover{ background:var(--teal-900); }
  .btn:disabled{ background:var(--line); color:var(--ink-500); cursor:not-allowed; }
  .btn.secondary{ background:transparent; color:var(--ink-500); font-weight:600; margin-top:10px; }
  .btn:focus-visible{ outline:3px solid var(--gold-500); outline-offset:2px; }

  .overlay{
    position:fixed; inset:0; background:linear-gradient(135deg, var(--teal-900), var(--teal-700));
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; z-index:50; transition:opacity .5s ease;
  }
  .overlay.hide{ opacity:0; pointer-events:none; }
  .spinner{ width:40px; height:40px; border-radius:50%; border:3px solid rgba(255,255,255,.25); border-top-color:#fff; animation:spin .9s linear infinite; margin-bottom:16px; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .overlay .msg{ font-family:'Manrope',sans-serif; font-weight:700; font-size:15px; }
  .overlay .sub{ font-size:13px; opacity:.7; margin-top:6px; }
  .progress-track{ width:180px; height:4px; border-radius:4px; background:rgba(255,255,255,.2); margin-top:14px; overflow:hidden; }
  .progress-fill{ height:100%; width:0%; background:var(--gold-500); transition:width .3s ease; }
  .retry-btn{ margin-top:16px; padding:10px 20px; border-radius:100px; border:none; background:var(--gold-500); color:var(--teal-900); font-weight:700; cursor:pointer; display:none; }
  .overlay.error .spinner{ display:none; }
  .overlay.error .retry-btn{ display:inline-block; }
</style>
</head>
<body>

<div class="overlay" id="overlay">
  <div class="spinner"></div>
  <div class="msg" id="overlayMsg">Preparing report portal…</div>
  <div class="sub" id="overlaySub">Loading recognition models</div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <button class="retry-btn" onclick="init()">Try again</button>
</div>

<div class="card">
  <div class="head">
    <div class="eyebrow">Klinik Kesihatan Ayer Hitam</div>
    <h1>My Attendance Report</h1>
    <div class="gold-dot"></div>
  </div>
  <div class="stage">

    <div id="loginStep">
      <div class="viewfinder">
        <div class="ring" id="ring"></div>
        <video id="video" autoplay muted playsinline></video>
      </div>
      <div class="status-line" id="statusLine">Look at the camera to log in</div>
    </div>

    <div class="welcome" id="welcomeStep">
      <h2 id="welcomeName">—</h2>
      <div class="ic" id="welcomeIc">—</div>

      <div class="field">
        <label for="monthSelect">Month</label>
        <select id="monthSelect"></select>
      </div>

      <button class="btn" id="generateBtn" onclick="handleGenerate()">Generate PDF Report</button>
      <button class="btn secondary" onclick="location.reload()">Switch user</button>
    </div>

  </div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxOamlCtYPlZCvQOys1VTjkZu7aVqMsdDStTdytPex7eH5jNGuIBiR91BfougaEF3SI/exec';
const MODEL_URL = './models';
const MATCH_THRESHOLD = 0.5;
const AMBIGUITY_MARGIN = 0.07;
const RECOGNIZE_STABLE_FRAMES = 3;

let video, ring, statusLine, overlay, overlaySub, progressFill;
let labeledDescriptors = [];
let modelsReady = false;
let scanning = true;
let stableCount = 0;
let lastCandidate = null;
let loggedInIc = null, loggedInName = null;

window.addEventListener('DOMContentLoaded', init);
window.addEventListener('unhandledrejection', (e) => {
  console.error('Unhandled error:', e.reason);
  if(!modelsReady) showLoadError(e.reason && e.reason.message ? e.reason.message : 'Failed to load recognition models');
});

async function init(){
  video = document.getElementById('video');
  ring = document.getElementById('ring');
  statusLine = document.getElementById('statusLine');
  overlay = document.getElementById('overlay');
  overlaySub = document.getElementById('overlaySub');
  progressFill = document.getElementById('progressFill');
  overlay.classList.remove('error', 'hide');
  modelsReady = false;
  populateMonths();

  try{
    await loadModels();
    const staff = await fetchStaff();
    await buildDescriptors(staff);
    await startCamera();
    hideOverlay();
    detectLoop();
  }catch(err){
    console.error(err);
    showLoadError(err.message);
  }
}

function showLoadError(message){
  document.getElementById('overlayMsg').textContent = 'Could not start portal';
  overlaySub.textContent = message || 'Please check your connection and try again';
  overlay.classList.add('error');
}

function setProgress(pct, sub){ progressFill.style.width = pct + '%'; if(sub) overlaySub.textContent = sub; }

async function loadModels(){
  setProgress(10, 'Loading face detection model');
  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  if(!faceapi.nets.tinyFaceDetector.isLoaded) throw new Error('Face detection model failed to load');
  setProgress(30, 'Loading landmark model');
  await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
  if(!faceapi.nets.faceLandmark68Net.isLoaded) throw new Error('Landmark model failed to load');
  setProgress(50, 'Loading recognition model');
  await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
  if(!faceapi.nets.faceRecognitionNet.isLoaded) throw new Error('Recognition model failed to load');
  modelsReady = true;
  setProgress(60, 'Models ready');
}

async function fetchStaff(){
  setProgress(65, 'Loading staff database');
  const res = await fetch(API_URL + '?action=getStaff');
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || 'Failed to load staff');
  return data.staff;
}

async function buildDescriptors(staff){
  labeledDescriptors = [];
  const total = staff.length;
  for(let i = 0; i < total; i++){
    const s = staff[i];
    try{
      const img = await faceapi.fetchImage(s.photo);
      const det = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions())
        .withFaceLandmarks().withFaceDescriptor();
      if(det) labeledDescriptors.push({ ic: s.ic, name: s.name, descriptor: det.descriptor });
    }catch(e){ console.warn('Skipping staff photo', s.name, e); }
    setProgress(65 + Math.round((i / total) * 30), `Indexing staff faces (${i+1}/${total})`);
  }
  if(labeledDescriptors.length === 0) throw new Error('No usable staff photos found');
  setProgress(100, 'Ready');
}

function matchFace(descriptor){
  const distances = labeledDescriptors
    .map(s => ({ ic: s.ic, name: s.name, distance: faceapi.euclideanDistance(descriptor, s.descriptor) }))
    .sort((a, b) => a.distance - b.distance);
  if(distances.length === 0 || distances[0].distance > MATCH_THRESHOLD) return { label: 'unknown' };
  if(distances.length > 1 && (distances[1].distance - distances[0].distance) < AMBIGUITY_MARGIN) return { label: 'ambiguous' };
  return { label: distances[0].ic + '|' + distances[0].name };
}

async function startCamera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width:280, height:280 } });
    video.srcObject = stream;
    await new Promise(r => video.onloadedmetadata = r);
  }catch(err){
    throw new Error('Camera permission denied');
  }
}

function hideOverlay(){ overlay.classList.add('hide'); }

async function detectLoop(){
  if(!scanning || !modelsReady){ requestAnimationFrame(detectLoop); return; }

  let det = null;
  try{
    det = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
      .withFaceLandmarks().withFaceDescriptor();
  }catch(err){
    console.warn('Detection frame skipped:', err);
    requestAnimationFrame(detectLoop);
    return;
  }

  if(det){
    ring.classList.add('scanning');
    const best = matchFace(det.descriptor);
    if(best.label === 'ambiguous'){
      statusLine.textContent = 'Not clear enough — move closer';
      lastCandidate = null; stableCount = 0;
    }else if(best.label !== 'unknown'){
      if(lastCandidate === best.label){ stableCount++; } else { lastCandidate = best.label; stableCount = 1; }
      statusLine.textContent = 'Recognizing…';
      if(stableCount >= RECOGNIZE_STABLE_FRAMES){
        const [ic, name] = best.label.split('|');
        scanning = false;
        loggedInIc = ic; loggedInName = name;
        onLoggedIn(name, ic);
        return;
      }
    }else{
      statusLine.textContent = 'Face not recognized';
      lastCandidate = null; stableCount = 0;
    }
  }else{
    ring.classList.remove('scanning');
    statusLine.textContent = 'Look at the camera to log in';
    lastCandidate = null; stableCount = 0;
  }
  requestAnimationFrame(detectLoop);
}

function onLoggedIn(name, ic){
  ring.classList.remove('scanning');
  ring.classList.add('success');
  if(video.srcObject){ video.srcObject.getTracks().forEach(t => t.stop()); }
  document.getElementById('loginStep').style.display = 'none';
  document.getElementById('welcomeName').textContent = name;
  document.getElementById('welcomeIc').textContent = 'IC: ' + ic;
  document.getElementById('welcomeStep').classList.add('show');
}

function populateMonths(){
  const sel = document.getElementById('monthSelect');
  const names = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const now = new Date();
  sel.innerHTML = '';
  for(let i = 0; i < 12; i++){
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const opt = document.createElement('option');
    opt.value = (d.getMonth()+1) + '-' + d.getFullYear();
    opt.textContent = names[d.getMonth()] + ' ' + d.getFullYear();
    sel.appendChild(opt);
  }
}

async function handleGenerate(){
  const btn = document.getElementById('generateBtn');
  const [month, year] = document.getElementById('monthSelect').value.split('-');
  btn.disabled = true;
  btn.textContent = 'Generating…';

  try{
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'generateReport', ic: loggedInIc, year, month })
    });
    const data = await res.json();
    if(!data.ok){
      alert(data.error || 'Could not generate report');
    }else{
      const link = document.createElement('a');
      link.href = 'data:application/pdf;base64,' + data.pdfBase64;
      link.download = data.filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }
  }catch(err){
    alert('Network error — please try again');
  }

  btn.disabled = false;
  btn.textContent = 'Generate PDF Report';
}
</script>
</body>
</html>
